<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大人大富翁 v2.0 - 派對狂歡版</title>
  <style>
    :root {
      --bg-color: #1e1e2e;
      --board-bg: #2a2a3c;
      --cell-bg: #3a3a52;
      --cell-border: #565676;
      --cell-text: #f5f6fa;
      
      --active-bg: #ff4757;
      --active-text: #ffffff;
      --active-shadow: 0 0 20px #ff4757;

      --primary: #ff4757;
      --secondary: #3742fa;
      --accent: #ffa502;
      --text: #f5f6fa;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 6px;
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 560px;
      height: calc(100vh - 12px);
      max-height: 860px;
      background: var(--board-bg);
      border: 4px solid #565676;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 3px;
      padding: 4px;
      position: relative;
    }

    .cell {
      background-color: var(--cell-bg);
      border: 2px solid var(--cell-border);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: 800;
      color: var(--cell-text);
      text-align: center;
      position: relative;
      transition: all 0.15s ease-in-out;
    }

    .cell.start-cell {
      background-color: #ffa502;
      border-color: #eccc68;
      color: #000;
      font-size: 18px;
    }

    .cell.active {
      background-color: var(--active-bg) !important;
      color: var(--active-text) !important;
      border-color: var(--active-bg);
      box-shadow: var(--active-shadow);
      font-size: 28px;
      transform: scale(1.06);
      z-index: 5;
    }

    .center-dashboard {
      grid-column: 2 / 6;
      grid-row: 2 / 10;
      background: #181825;
      border-radius: 12px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
      border: 2px dashed #45475a;
      z-index: 1;
    }

    .dashboard-title {
      font-size: 18px;
      color: #ff4757;
      font-weight: bold;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .version-tag {
      font-size: 12px;
      color: #a6adc8;
      font-weight: normal;
    }

    .section-box {
      width: 100%;
      background: #313244;
      padding: 6px 6px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-align: center;
    }

    .section-box-large {
      padding: 8px 8px !important;
      border: 2px solid #70a1ff;
    }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #bac2de;
      margin-bottom: 4px;
    }

    .section-title-large {
      font-size: 15px !important;
      font-weight: 900 !important;
      color: #ffffff !important;
      margin-bottom: 6px !important;
    }

    .input-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    input[type="number"] {
      width: 52px;
      height: 36px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      background: #1e1e2e;
      color: #fff;
      border: 2px solid #70a1ff;
      border-radius: 8px;
      outline: none;
    }

    .input-large {
      width: 75px !important;
      height: 44px !important;
      font-size: 22px !important;
      border-width: 3px !important;
    }

    .btn {
      padding: 6px 10px;
      font-size: 13px;
      font-weight: bold;
      color: white;
      background-color: var(--secondary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 0 #1e90ff;
    }

    .btn:active {
      box-shadow: 0 1px 0 #1e90ff;
      transform: translateY(2px);
    }

    .btn-big {
      font-size: 16px !important;
      padding: 8px 14px !important;
      border-radius: 12px !important;
      font-weight: 900 !important;
      min-height: 42px;
    }

    .btn-adjust {
      width: 36px;
      height: 36px;
      font-size: 20px;
      font-weight: 900;
      border-radius: 8px;
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 0;
    }

    .btn-adjust-large {
      width: 44px !important;
      height: 44px !important;
      font-size: 24px !important;
      border-radius: 12px !important;
    }

    .btn-minus {
      background-color: #ff4757;
      box-shadow: 0 3px 0 #ff6b81;
    }
    .btn-minus:active {
      box-shadow: 0 1px 0 #ff6b81;
      transform: translateY(2px);
    }

    .btn-plus {
      background-color: #2ed573;
      box-shadow: 0 3px 0 #26af5f;
    }
    .btn-plus:active {
      box-shadow: 0 1px 0 #26af5f;
      transform: translateY(2px);
    }

    .dual-dice-group {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 6px;
    }

    .dice-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .dice-label {
      font-size: 13px;
      font-weight: bold;
      color: #cdd6f4;
    }

    .dice-box {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #ffa502, #ff6b81);
      border: 3px solid #eccc68;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 0 #d63031;
    }

    .dice-box.rolling {
      animation: diceRoll 0.8s ease-in-out infinite;
    }

    @keyframes diceRoll {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-25deg) scale(1.15); }
      50% { transform: rotate(25deg) scale(0.9); }
      75% { transform: rotate(-15deg) scale(1.1); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .money-total-box {
      background: #1e1e2e;
      border: 2px dashed #ffa502;
      border-radius: 10px;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .money-title {
      font-size: 14px;
      font-weight: bold;
      color: #cdd6f4;
    }

    .money-val {
      font-size: 20px;
      font-weight: 900;
      color: #2ed573;
    }

    .stat-display {
      font-size: 20px;
      font-weight: bold;
      color: #ffa502;
      min-width: 48px;
    }

    .timer-display-box {
      font-size: 26px;
      font-weight: 900;
      color: #ff4757;
      background: #1e1e2e;
      padding: 6px 12px;
      border-radius: 10px;
      border: 2px solid #ff4757;
      margin: 10px 0;
      display: inline-block;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-content {
      background: #2a2a3c;
      color: #fff;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 4px solid var(--accent);
      transform: scale(0.8);
      transition: transform 0.2s;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-title {
      font-size: 22px;
      color: #ff4757;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .modal-desc {
      font-size: 16px;
      color: #cdd6f4;
      margin-bottom: 12px;
      font-weight: bold;
      line-height: 1.4;
      white-space: pre-line;
    }

    .modal-btn {
      font-size: 16px;
      padding: 8px 18px;
      margin: 4px;
    }

    .diff-btn-group, .option-btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
    }

    .opt-btn {
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      background: #3742fa;
      color: white;
      box-shadow: 0 3px 0 #1e90ff;
      cursor: pointer;
    }

    .opt-btn.color-black {
      background-color: #111;
      color: white;
      border: 1px solid #444;
      box-shadow: 0 3px 0 #000;
    }

    .opt-btn.color-white {
      background-color: #ffffff;
      color: #2d3436;
      box-shadow: 0 3px 0 #b2bec3;
    }

    .opt-btn.color-red {
      background-color: #ff4757;
      color: white;
      box-shadow: 0 3px 0 #d63031;
    }

    .opt-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1e90ff;
    }

    .opt-btn.disabled {
      background: #57606f !important;
      box-shadow: 0 3px 0 #2f3542 !important;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .sound-btn {
      background: #ffa502;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      margin: 8px 0;
      cursor: pointer;
      display: inline-block;
      box-shadow: 0 3px 0 #eccc68;
    }
    .sound-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #eccc68;
    }
  </style>
</head>
<body>

  <div class="game-container" id="board">
    <div class="center-dashboard">
      <div class="dashboard-title">
        🍸 派對大富翁 - 大人版<span class="version-tag">v2.0</span>
      </div>

      <div class="section-box section-box-large">
        <div class="section-title section-title-large">🎲 骰點區 (籌碼1-5 / 懲罰號碼1-18)</div>
        <div class="dual-dice-group">
          <div class="dice-item">
            <span class="dice-label">💰 籌碼骰(1-5)</span>
            <div class="dice-box" id="moneyDiceBox" onclick="rollSingleDice('money')">1</div>
            <button class="btn btn-big" style="background-color: #2ed573; box-shadow: 0 4px 0 #26af5f;" onclick="rollSingleDice('money')">擲籌碼</button>
          </div>
          <div class="dice-item">
            <span class="dice-label">🎯 號碼骰(1-18)</span>
            <div class="dice-box" id="stepDiceBox" onclick="rollSingleDice('step')">1</div>
            <button class="btn btn-big" style="background-color: #ffa502; box-shadow: 0 4px 0 #eccc68;" onclick="rollSingleDice('step')">抽號碼</button>
          </div>
        </div>

        <div class="money-total-box">
          <div class="money-title">目前籌碼：</div>
          <div class="money-val" id="totalMoneyDisplay">$0</div>
          <div class="input-group">
            <button class="btn-adjust btn-minus" style="width:30px; height:30px; font-size:16px;" onclick="customAdjustMoney(-1)">-</button>
            <button class="btn-adjust btn-plus" style="width:30px; height:30px; font-size:16px;" onclick="customAdjustMoney(1)">+</button>
          </div>
        </div>
      </div>

      <div class="section-box section-box-large" style="border-color: #ff4757;">
        <div class="section-title section-title-large">🚶‍♂️ 移動步數 (不可為0)</div>
        <div class="input-group">
          <button class="btn-adjust btn-adjust-large btn-minus" onclick="changeStep(-1)">-</button>
          <input type="number" id="stepInput" class="input-large" value="1">
          <button class="btn-adjust btn-adjust-large btn-plus" onclick="changeStep(1)">+</button>
          <button class="btn btn-big" style="margin-left: 6px; background-color: #ff4757; box-shadow: 0 4px 0 #d63031;" onclick="handleManualMove()">移動</button>
        </div>
      </div>

      <!-- 禮物數修改為 倒數計時秒數設定 -->
      <div class="section-box">
        <div class="section-title">⏱️ 答題計時器 (最少3秒)</div>
        <div class="input-group">
          <button class="btn-adjust btn-minus" onclick="changeTimerSeconds(-1)">-</button>
          <span class="stat-display" id="timerSecondsDisplay">10s</span>
          <button class="btn-adjust btn-plus" onclick="changeTimerSeconds(1)">+</button>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">目標圈數 / 已完成圈數</div>
        <div class="input-group" style="margin-bottom: 2px;">
          <button class="btn-adjust btn-minus" onclick="changeTargetLaps(-1)">-</button>
          <input type="number" id="targetLapInput" value="1" min="1">
          <button class="btn-adjust btn-plus" onclick="changeTargetLaps(1)">+</button>
        </div>
        <div style="font-size: 12px; font-weight: bold; color: #70a1ff;">
          已完成 <span id="completedLapDisplay">0</span> / <span id="targetLapDisplay">1</span> 圈
        </div>
      </div>

      <button class="btn btn-big" style="background-color: #a55eea; box-shadow: 0 4px 0 #8854d0; width: 95%; min-height:38px; font-size:15px !important;" onclick="resetGame()">🔄 重新開始 (保留籌碼)</button>
    </div>
  </div>

  <div class="modal-overlay" id="moneyModal">
    <div class="modal-content" style="border-color: #ffa502;">
      <div class="modal-title" id="moneyModalTitle" style="color: #ffa502;">💰 調整籌碼</div>
      <div style="font-size: 14px; color: #a6adc8; margin-bottom: 10px;">請點擊按鈕或手動輸入籌碼：</div>
      <div class="input-group" style="margin-bottom: 12px;">
        <button class="btn-adjust btn-minus" style="width:42px; height:42px; font-size:22px;" onclick="changeModalMoneyInput(-100)">-</button>
        <input type="number" id="moneyModalInput" value="500" style="width: 100px; height: 42px; font-size: 20px;">
        <button class="btn-adjust btn-plus" style="width:42px; height:42px; font-size:22px;" onclick="changeModalMoneyInput(100)">+</button>
      </div>
      <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 16px;">
        <button class="btn" style="background-color: #ff4757; box-shadow: 0 3px 0 #d63031; padding: 6px 12px;" onclick="changeModalMoneyInput(-500)">-500</button>
        <button class="btn" style="background-color: #2ed573; box-shadow: 0 3px 0 #26af5f; padding: 6px 12px;" onclick="changeModalMoneyInput(500)">+500</button>
      </div>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button class="btn modal-btn" style="background-color: #2ed573; box-shadow: 0 4px 0 #26af5f;" onclick="confirmCustomMoney()">確定</button>
        <button class="btn modal-btn" style="background-color: #ff4757; box-shadow: 0 4px 0 #d63031;" onclick="closeModal('moneyModal')">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="diceModal">
    <div class="modal-content" style="border-color: #70a1ff;">
      <div class="modal-title" id="diceModalTitle" style="color: #70a1ff;">🎲 骰子結果</div>
      <div class="modal-desc" id="diceModalPoint">骰出點數：0 點</div>
      <div class="modal-desc" style="color: #2ed573; font-size: 20px;" id="diceModalMoney">號碼：0 號</div>
      <button class="btn modal-btn" onclick="closeModal('diceModal')">確定</button>
    </div>
  </div>

  <div class="modal-overlay" id="winModal">
    <div class="modal-content" style="border-color: #ff4757;">
      <div class="modal-title">🏆 全場狂歡冠軍！</div>
      <div class="modal-desc">恭喜完成目標圈數！今晚你就是全場焦點！</div>
      <button class="btn modal-btn" style="background-color: #2ed573; box-shadow: 0 4px 0 #26af5f;" onclick="resetGame()">再開一局 (保留籌碼)</button>
    </div>
  </div>

  <div class="modal-overlay" id="askChallengeModal">
    <div class="modal-content" style="border-color: #ff4757;">
      <div class="modal-title">🔥 派對大冒險挑戰！</div>
      <div class="modal-desc" id="askChallengeName">發現挑戰！要接受派對任務嗎？</div>
      <div style="display:flex; justify-content:center; gap: 10px;">
        <button class="btn modal-btn" style="background-color: #2ed573; box-shadow: 0 4px 0 #26af5f;" onclick="acceptChallenge()">接受挑戰</button>
        <button class="btn modal-btn" style="background-color: #57606f; box-shadow: 0 4px 0 #2f3542;" onclick="closeModal('askChallengeModal')">怕了不挑戰</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="selectDiffModal">
    <div class="modal-content" style="border-color: #70a1ff;">
      <div class="modal-title" id="selectDiffTitle">選擇難度 / 賭注</div>
      <div class="modal-desc" style="font-size:14px; color:#ffa502;" id="userMoneyHint">目前持有籌碼：$0</div>
      <div class="diff-btn-group" id="diffBtnContainer"></div>
      <button class="btn modal-btn" style="background-color: #57606f; box-shadow: 0 4px 0 #2f3542;" onclick="closeModal('selectDiffModal')">返回</button>
    </div>
  </div>

  <!-- 問答/挑戰 彈窗 (包含倒數計時器) -->
  <div class="modal-overlay" id="playGameModal">
    <div class="modal-content" style="border-color: #a55eea;">
      <div class="modal-title" id="gameModalTitle">挑戰進行中</div>
      <div class="timer-display-box" id="modalTimerDisplay">⏱️ 10 秒</div>
      <div class="modal-desc" id="gameModalQuestion">題目載入中...</div>
      <div id="gameSoundContainer"></div>
      <div class="option-btn-group" id="gameOptionsContainer"></div>
    </div>
  </div>

  <div class="modal-overlay" id="resultModal">
    <div class="modal-content" id="resultContent">
      <div class="modal-title" id="resultModalTitle">挑戰結果</div>
      <div class="modal-desc" id="resultModalText">...</div>
      <div class="modal-desc" style="color: #ff4757;" id="resultModalAnswer"></div>
      <button class="btn modal-btn" style="background-color: #2ed573; box-shadow: 0 4px 0 #26af5f;" onclick="closeModal('resultModal')">確定</button>
    </div>
  </div>

  <script>
    // 大人派對題庫 (知識、生活常識、酒吧文化)
    const adultWordBank = [
      { zh: "長島冰茶", en: "Long Island" }, { zh: "莫西多", en: "Mojito" },
      { zh: "瑪格麗特", en: "Marguerite" }, { zh: "威士忌", en: "Whisky" },
      { zh: "伏特加", en: "Vodka" }, { zh: "香檳", en: "Champagne" },
      { zh: "龍舌蘭", en: "Tequila" }, { zh: "琴酒", en: "Gin" },
      { zh: "紅酒", en: "Red Wine" }, { zh: "精釀啤酒", en: "Craft Beer" },
      { zh: "宿醉", en: "Hangover" }, { zh: "真心話", en: "Truth" },
      { zh: "大冒險", en: "Dare" }, { zh: "乾杯", en: "Cheers" },
      { zh: "深夜食堂", en: "Midnight Snack" }, { zh: "加薪", en: "Pay Raise" },
      { zh: "年終獎金", en: "Bonus" }, { zh: "退坑", en: "Quit" }
    ];

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playClickSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    function playStepSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(350, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }

    function playWinSound() {
      initAudio();
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const startTime = audioCtx.currentTime + idx * 0.12;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(startTime); osc.stop(startTime + 0.3);
      });
    }

    function speakText(text, lang = 'zh-TW') {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // 大人版挑戰關卡
    const challengeCategories = [
      {
        name: "派對大冒險 (真心話/體能)",
        type: "normal",
        levels: [
          { diffName: "喝一口 / 伏地挺身 5 下", reward: 200, need: 100, type: "action", target: "完成指定動作或喝一口" },
          { diffName: "公開手機相簿最新一張照片", reward: 500, need: 200, type: "action", target: "公開手機相簿照片" },
          { diffName: "現場對右邊朋友告白10秒", reward: 1000, need: 300, type: "action", target: "告白10秒" }
        ]
      },
      {
        name: "酒吧左輪猜顏色",
        type: "color_guess",
        need: 200,
        options: [
          { colorName: "黑色", reward: 500 },
          { colorName: "白色", reward: 500 },
          { colorName: "紅色", reward: 500 }
        ]
      },
      {
        name: "酒桌心算擂台",
        type: "normal",
        levels: [
          { diffName: "簡單 (兩數加總)", reward: 200, need: 100, type: "math_add_2" },
          { diffName: "中等 (酒桌相減)", reward: 500, need: 200, type: "math_sub_2" },
          { diffName: "困難 (心算爆頭)", reward: 1000, need: 300, type: "math_mix_3" }
        ]
      },
      {
        name: "酒吧英文調酒聽力",
        type: "normal",
        levels: [
          { diffName: "簡單 (1個英文字母)", reward: 200, need: 100, type: "phonics_en", count: 1 },
          { diffName: "中等 (2個英文字母)", reward: 500, need: 200, type: "phonics_en", count: 2 },
          { diffName: "困難 (3個英文字母)", reward: 1000, need: 300, type: "phonics_en", count: 3 }
        ]
      },
      {
        name: "調酒與派對單字挑戰",
        type: "normal",
        levels: [
          { diffName: "簡單 (賺$200)", reward: 200, need: 100, type: "word_en" },
          { diffName: "中等 (賺$500)", reward: 500, need: 200, type: "word_en" },
          { diffName: "困難 (賺$1000)", reward: 1000, need: 300, type: "word_en" }
        ]
      }
    ];

    const COLS = 6, ROWS = 10;
    const pathCoords = [];
    for (let c = 1; c <= COLS; c++) pathCoords.push({ r: 1, c: c });
    for (let r = 2; r <= ROWS; r++) pathCoords.push({ r: r, c: COLS });
    for (let c = COLS - 1; c >= 1; c--) pathCoords.push({ r: ROWS, c: c });
    for (let r = ROWS - 1; r >= 2; r--) pathCoords.push({ r: r, c: 1 });

    const totalCells = pathCoords.length;
    let currentPosition = 0;
    let totalStepsTaken = 0;
    let timerSettingSeconds = 10; // 預設答題計時10秒
    let activeTimerInterval = null; // 計時器控制
    let completedLaps = 0;
    let targetLaps = 1;
    let totalMoney = 0;
    let isMoving = false;
    let isRolling = false;
    let currentMoneyDir = 1;

    let selectedCategory = null;

    const cellElements = [];
    const board = document.getElementById('board');

    pathCoords.forEach((coord, idx) => {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.id = `cell-${idx}`;
      cell.style.gridRow = coord.r;
      cell.style.gridColumn = coord.c;

      if (idx === 0) {
        cell.classList.add('start-cell');
        cell.innerHTML = '起點<br>0';
      } else {
        cell.innerText = idx;
      }
      board.appendChild(cell);
      cellElements.push(cell);
    });

    updatePlayerPositionUI();

    // 倒數計時器核心邏輯
    function startCountdown(seconds, onTimeout) {
      clearInterval(activeTimerInterval);
      let timeLeft = seconds;
      const display = document.getElementById('modalTimerDisplay');
      display.innerText = `⏱️ ${timeLeft} 秒`;
      display.style.color = "#ff4757";

      activeTimerInterval = setInterval(() => {
        timeLeft--;
        display.innerText = `⏱️ ${timeLeft} 秒`;
        if (timeLeft <= 3) {
          display.style.color = "#ff6b81";
          playStepSound();
        }
        if (timeLeft <= 0) {
          clearInterval(activeTimerInterval);
          onTimeout();
        }
      }, 1000);
    }

    function stopCountdown() {
      if (activeTimerInterval) {
        clearInterval(activeTimerInterval);
        activeTimerInterval = null;
      }
    }

    function rollSingleDice(type) {
      if (isRolling || isMoving) return;
      isRolling = true;
      playClickSound();

      const maxVal = (type === 'money') ? 5 : 18;
      const targetBox = document.getElementById(type === 'money' ? 'moneyDiceBox' : 'stepDiceBox');
      targetBox.classList.add('rolling');

      const rollInterval = setInterval(() => {
        targetBox.innerText = Math.floor(Math.random() * maxVal) + 1;
        playStepSound();
      }, 60);

      setTimeout(() => {
        clearInterval(rollInterval);
        const finalValue = Math.floor(Math.random() * maxVal) + 1;
        targetBox.innerText = finalValue;
        targetBox.classList.remove('rolling');
        isRolling = false;

        if (type === 'money') {
          const earned = finalValue * 100;
          totalMoney += earned;
          document.getElementById('totalMoneyDisplay').innerText = `$${totalMoney}`;
          document.getElementById('diceModalTitle').innerText = '💰 籌碼骰結果';
          document.getElementById('diceModalPoint').innerText = `骰出點數：${finalValue} 點`;
          document.getElementById('diceModalMoney').innerText = `獲得籌碼：$${earned} 元`;
        } else {
          document.getElementById('diceModalTitle').innerText = '🍺 懲罰號碼';
          document.getElementById('diceModalPoint').innerText = `骰出點數：${finalValue} 點`;
          document.getElementById('diceModalMoney').innerText = `抽中號碼：${finalValue} 號`;
        }
        openModal('diceModal');
      }, 800);
    }

    function customAdjustMoney(direction) {
      playClickSound();
      currentMoneyDir = direction;
      document.getElementById('moneyModalTitle').innerText = direction > 0 ? "💰 增加籌碼 (+)" : "💰 扣除籌碼 (-)";
      document.getElementById('moneyModalInput').value = 0;
      openModal('moneyModal');
    }

    function changeModalMoneyInput(delta) {
      playClickSound();
      const input = document.getElementById('moneyModalInput');
      let val = parseInt(input.value, 10) || 0;
      input.value = Math.max(0, val + delta);
    }

    function confirmCustomMoney() {
      playClickSound();
      const input = document.getElementById('moneyModalInput');
      let amount = parseInt(input.value, 10) || 0;
      totalMoney += amount * currentMoneyDir;
      document.getElementById('totalMoneyDisplay').innerText = `$${totalMoney}`;
      closeModal('moneyModal');
    }

    function changeStep(delta) {
      playClickSound();
      const input = document.getElementById('stepInput');
      let val = (parseInt(input.value, 10) || 0) + delta;
      if (val === 0) val = delta > 0 ? 1 : -1;
      input.value = val;
    }

    // 禮物數改為秒數設定
    function changeTimerSeconds(delta) {
      playClickSound();
      timerSettingSeconds = Math.max(3, timerSettingSeconds + delta);
      document.getElementById('timerSecondsDisplay').innerText = `${timerSettingSeconds}s`;
    }

    function changeTargetLaps(delta) {
      playClickSound();
      const input = document.getElementById('targetLapInput');
      targetLaps = Math.max(1, (parseInt(input.value, 10) || 1) + delta);
      input.value = targetLaps;
      document.getElementById('targetLapDisplay').innerText = targetLaps;
    }

    function handleManualMove() {
      playClickSound();
      if (isMoving) return;
      const input = document.getElementById('stepInput');
      let steps = parseInt(input.value, 10);
      if (isNaN(steps) || steps === 0) {
        alert("移動步數不能為 0 ！");
        input.value = 1;
        return;
      }
      movePlayerStepByStep(steps);
    }

    async function movePlayerStepByStep(steps) {
      isMoving = true;
      const direction = steps > 0 ? 1 : -1;
      const totalSteps = Math.abs(steps);

      for (let i = 0; i < totalSteps; i++) {
        currentPosition = (currentPosition + direction + totalCells) % totalCells;
        totalStepsTaken += (direction > 0 ? 1 : -1);
        totalStepsTaken = Math.max(0, totalStepsTaken);

        completedLaps = Math.floor(totalStepsTaken / totalCells);
        document.getElementById('completedLapDisplay').innerText = completedLaps;

        updatePlayerPositionUI();
        playStepSound();
        await new Promise(resolve => setTimeout(resolve, 200));
      }

      isMoving = false;
      document.getElementById('stepInput').value = 1;

      if (completedLaps >= targetLaps) {
        playWinSound();
        openModal('winModal');
      } else if (currentPosition !== 0) {
        triggerChallengePrompt();
      }
    }

    function updatePlayerPositionUI() {
      cellElements.forEach(cell => cell.classList.remove('active'));
      if (cellElements[currentPosition]) cellElements[currentPosition].classList.add('active');
    }

    function triggerChallengePrompt() {
      const randIdx = Math.floor(Math.random() * challengeCategories.length);
      selectedCategory = challengeCategories[randIdx];
      
      document.getElementById('askChallengeName').innerText = `踩到了挑戰格！【${selectedCategory.name}】\n敢接受挑戰嗎？`;
      openModal('askChallengeModal');
    }

    function acceptChallenge() {
      closeModal('askChallengeModal');
      document.getElementById('userMoneyHint').innerText = `目前持有籌碼：$${totalMoney}`;
      const container = document.getElementById('diffBtnContainer');
      container.innerHTML = '';

      if (selectedCategory.type === "color_guess") {
        document.getElementById('selectDiffTitle').innerText = `${selectedCategory.name} - 請下注顏色`;
        const need = selectedCategory.need;
        const canAfford = totalMoney >= need;

        selectedCategory.options.forEach(opt => {
          const btn = document.createElement('button');
          const colorClass = {
            "黑色": "color-black",
            "白色": "color-white",
            "紅色": "color-red"
          }[opt.colorName];

          btn.className = `opt-btn ${colorClass} ${canAfford ? '' : 'disabled'}`;
          btn.innerText = `猜【${opt.colorName}】 (下注$${need} / 贏得$${opt.reward})`;

          if (canAfford) {
            btn.onclick = () => startColorGuessGame(opt.colorName, opt.reward, need);
          } else {
            btn.onclick = () => {
              alert(`籌碼不足！需要 $${need}，你只有 $${totalMoney}。`);
            };
          }
          container.appendChild(btn);
        });
      } else {
        document.getElementById('selectDiffTitle').innerText = `${selectedCategory.name} - 選擇難度`;
        selectedCategory.levels.forEach(lvl => {
          const btn = document.createElement('button');
          const canAfford = totalMoney >= lvl.need;
          btn.className = `opt-btn ${canAfford ? '' : 'disabled'}`;
          btn.innerText = `${lvl.diffName} (門票$${lvl.need})`;
          
          if (canAfford) {
            btn.onclick = () => startChallengeGame(lvl);
          } else {
            btn.onclick = () => {
              alert(`籌碼不足！需要 $${lvl.need}，你只有 $${totalMoney}。`);
            };
          }
          container.appendChild(btn);
        });
      }

      openModal('selectDiffModal');
    }

    function startColorGuessGame(chosenColor, reward, need) {
      closeModal('selectDiffModal');
      totalMoney -= need;
      document.getElementById('totalMoneyDisplay').innerText = `$${totalMoney}`;

      const allColors = ["黑色", "白色", "紅色"];
      const actualColor = allColors[Math.floor(Math.random() * allColors.length)];
      const isCorrect = (chosenColor === actualColor);

      if (isCorrect) {
        totalMoney += reward;
        document.getElementById('totalMoneyDisplay').innerText = `$${totalMoney}`;
      }

      const title = document.getElementById('resultModalTitle');
      const text = document.getElementById('resultModalText');
      const ansText = document.getElementById('resultModalAnswer');

      if (isCorrect) {
        playWinSound();
        title.innerText = "🎉 賭贏了！恭喜獲勝！";
        title.style.color = "#2ed573";
        text.innerText = `你押【${chosenColor}】，莊家開【${actualColor}】！\n贏得籌碼 $${reward} 元！`;
        ansText.innerText = "";
      } else {
        playClickSound();
        title.innerText = "❌ 殘念！沒猜中～";
        title.style.color = "#ff4757";
        text.innerText = `你押【${chosenColor}】，莊家開【${actualColor}】！`;
        ansText.innerText = `沒收下注金 $${need}`;
      }

      openModal('resultModal');
    }

    function startChallengeGame(level) {
      closeModal('selectDiffModal');

      totalMoney -= level.need;
      document.getElementById('totalMoneyDisplay').innerText = `$${totalMoney}`;

      const title = document.getElementById('gameModalTitle');
      const qText = document.getElementById('gameModalQuestion');
      const soundContainer = document.getElementById('gameSoundContainer');
      const optsContainer = document.getElementById('gameOptionsContainer');

      title.innerText = `${selectedCategory.name} (${level.diffName})`;
      soundContainer.innerHTML = '';
      optsContainer.innerHTML = '';

      let correctAnswer = "";
      let options = [];

      if (level.type === 'action') {
        qText.innerText = `[已扣門票 $${level.need}]\n任務：${level.target}`;
        options = ["完成任務", "放棄/失敗"];
        correctAnswer = "完成任務";
      } 
      else if (level.type.startsWith('math')) {
        let n1, n2, n3, ans;
        if (level.type === 'math_add_2') {
          n1 = Math.floor(Math.random() * 20) + 10;
          n2 = Math.floor(Math.random() * 20) + 10;
          ans = n1 + n2;
          qText.innerText = `[已扣門票 $${level.need}]\n快速心算：${n1} + ${n2} = ?`;
        } else if (level.type === 'math_sub_2') {
          n1 = Math.floor(Math.random() * 30) + 20;
          n2 = Math.floor(Math.random() * 15) + 5;
          ans = n1 - n2;
          qText.innerText = `[已扣門票 $${level.need}]\n快速心算：${n1} - ${n2} = ?`;
        } else {
          n1 = Math.floor(Math.random() * 20) + 10;
          n2 = Math.floor(Math.random() * 15) + 5;
          n3 = Math.floor(Math.random() * 10) + 1;
          ans = n1 + n2 - n3;
          qText.innerText = `[已扣門票 $${level.need}]\n快速心算：${n1} + ${n2} - ${n3} = ?`;
        }
        correctAnswer = ans.toString();
        options = generate3Options(ans);
      }
      else if (level.type === 'phonics_en') {
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        let targetStr = "";
        for (let i = 0; i < level.count; i++) {
          targetStr += letters.charAt(Math.floor(Math.random() * letters.length));
        }
        qText.innerText = `[已扣門票 $${level.need}]\n請聽發音選出正確字母組合：`;
        correctAnswer = targetStr;
        options = generate3StrOptions(targetStr, () => {
          let s = "";
          for(let i=0;i<level.count;i++) s += letters.charAt(Math.floor(Math.random() * letters.length));
          return s;
        });

        const sBtn = document.createElement('button');
        sBtn.className = 'sound-btn';
        sBtn.innerText = '🔊 再次播放發音';
        sBtn.onclick = () => speakText(targetStr, 'en-US');
        soundContainer.appendChild(sBtn);
        speakText(targetStr, 'en-US');
      }
      else if (level.type === 'word_en') {
        const targetItem = adultWordBank[Math.floor(Math.random() * adultWordBank.length)];
        qText.innerText = `[已扣門票 $${level.need}]\n請聽發音選擇正確中文：`;
        correctAnswer = `${targetItem.zh} (${targetItem.en})`;
        
        options = generate3WordObjOptions(targetItem);
        
        const sBtn = document.createElement('button');
        sBtn.className = 'sound-btn';
        sBtn.innerText = '🔊 再次播放英文發音';
        sBtn.onclick = () => speakText(targetItem.en, 'en-US');
        soundContainer.appendChild(sBtn);
        speakText(targetItem.en, 'en-US');
      }

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => finishChallenge(opt === correctAnswer, correctAnswer, level.reward);
        optsContainer.appendChild(btn);
      });

      openModal('playGameModal');

      // 啟動倒數計時器
      startCountdown(timerSettingSeconds, () => {
        finishChallenge(false, correctAnswer, 0, true); // 時間到的逾時處理
      });
    }

    function generate3Options(correctVal) {
      const set = new Set([correctVal.toString()]);
      while(set.size < 3) {
        let delta = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
        set.add((correctVal + delta).toString());
      }
      return Array.from(set).sort(() => Math.random() - 0.5);
    }

    function generate3StrOptions(correctStr, genFunc) {
      const set = new Set([correctStr]);
      while(set.size < 3) {
        set.add(genFunc());
      }
      return Array.from(set).sort(() => Math.random() - 0.5);
    }

    function generate3WordObjOptions(correctItem) {
      const set = new Set();
      const formatStr = (item) => `${item.zh} (${item.en})`;
      
      set.add(formatStr(correctItem));
      while(set.size < 3) {
        const randomItem = adultWordBank[Math.floor(Math.random() * adultWordBank.length)];
        set.add(formatStr(randomItem));
      }
      return Array.from(set).sort(() => Math.random() - 0.5);
    }

    function finishChallenge(isSuccess, correctAnswer, reward, isTimeout = false) {
      stopCountdown();
      closeModal('playGameModal');
      
      const title = document.getElementById('resultModalTitle');
      const text = document.getElementById('resultModalText');
      const ansText = document.getElementById('resultModalAnswer');

      if (isTimeout) {
        playClickSound();
        title.innerText = "⌛ 時間到！挑戰失敗";
        title.style.color = "#ff4757";
        text.innerText = `手腳太慢囉！未在 ${timerSettingSeconds} 秒內回答完畢。`;
        ansText.innerText = `正確答案為：${correctAnswer}`;
      } else if (isSuccess) {
        playWinSound();
        title.innerText = "🎉 挑戰成功！";
        title.style.color = "#2ed573";
        if (reward > 0) {
          totalMoney += reward;
          document.getElementById('totalMoneyDisplay').innerText = `$${totalMoney}`;
          text.innerText = `順利完成！賺取籌碼 $${reward} 元！`;
        } else {
          text.innerText = `成功過關！`;
        }
        ansText.innerText = `正確答案為：${correctAnswer}`;
      } else {
        playClickSound();
        title.innerText = "❌ 答錯了！挑戰失敗";
        title.style.color = "#ff4757";
        text.innerText = `挑戰失敗，沒收門票籌碼。`;
        ansText.innerText = `正確答案為：${correctAnswer}`;
      }

      openModal('resultModal');
    }

    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      playClickSound();
      stopCountdown();
      document.getElementById(id).classList.remove('active');
    }

    function resetGame() {
      playClickSound();
      stopCountdown();
      currentPosition = 0;
      totalStepsTaken = 0;
      completedLaps = 0;
      
      document.getElementById('completedLapDisplay').innerText = completedLaps;
      document.getElementById('stepInput').value = 1;
      document.getElementById('moneyDiceBox').innerText = "1";
      document.getElementById('stepDiceBox').innerText = "1";
      updatePlayerPositionUI();
      closeModal('winModal');
    }
  </script>
</body>
