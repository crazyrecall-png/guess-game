            flex-direction: column;

            { ans: "火箭", zhuyin: "ㄏㄨㄛˇ ㄐㄧㄢˋ", en: "Rocket", kk: "[ˈrɑkɪt]", emoji: "🚀" },
            { ans: "熱氣球", zhuyin: "ㄖㄜˋ ㄑㄧˋ ㄑㄧㄡˊ", en: "Hot Air Balloon", kk: "[hɑt ɛr bəˈlun]", emoji: "🎈" },
            { ans: "摩托車", zhuyin: "ㄇㄛˊ ㄊㄨㄛ ㄔㄜ", en: "Motorcycle", kk: "[ˈmotɚˌsaɪkl]", emoji: "🛵" },
            { ans: "輪船", zhuyin: "ㄌㄨㄣˊ ㄔㄨㄢ", en: "Ship", kk: "[ʃɪp]", emoji: "🚢" },
            { ans: "潛水艇", zhuyin: "ㄑㄧㄢˊ ㄕㄨㄟˇ ㄊㄧㄥˇ", en: "Submarine", kk: "[ˈsʌbməˌrin]", emoji: "🌊" },
            { ans: "計程車", zhuyin: "ㄐㄧˋ ㄔㄥˊ ㄔㄜ", en: "Taxi", kk: "[ˈtæksi]", emoji: "🚕" }
        ]
    };

    // 遊戲狀態
    let currentCategory = 'fruit';
    let currentList = [];
    let currentIndex = 0;
    let isAnswerRevealed = false;

    // 洗牌演算法
    function shuffle(array) {
        let arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // 語音發音功能
    function speakText(text, lang) {
        try {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        } catch (e) {
            console.log("Speech Error: ", e);
        }
    }

    // 切換主題
    function changeCategory(cat) {
        currentCategory = cat;
        currentList = shuffle(gameData[cat]);
        currentIndex = 0;
        isAnswerRevealed = false;
        renderCard();
    }

    // 顯示答案
    function revealAnswer() {
        isAnswerRevealed = true;
        renderCard();
    }

    // 下一題
    function nextQuestion() {
        if (currentIndex < currentList.length - 1) {
            currentIndex++;
            isAnswerRevealed = false;
            renderCard();
        } else {
            renderCompletion();
        }
    }

    // 渲染遊戲卡片
    function renderCard() {
        const item = currentList[currentIndex];
        const card = document.getElementById('gameCard');

        if (!item || !card) return;

        let ansHtml = '';
        let btnHtml = '';

        if (!isAnswerRevealed) {
            ansHtml = `<div class="ans-box"><p style="color:#aaa; font-weight:bold;">猜猜看這是什麼？</p></div>`;
            btnHtml = `<button class="action-btn btn-show" onclick="revealAnswer()">💡 顯示答案</button>`;
        } else {
            ansHtml = `
                <div class="ans-box">
                    <div class="zh-text"><ruby>${item.ans}<rt>(${item.zhuyin})</rt></ruby></div>
                    <div class="en-text">${item.en} <span class="kk-text">${item.kk}</span></div>
                </div>
            `;
            btnHtml = `
                <button class="action-btn btn-zh" onclick="speakText('${item.ans}', 'zh-TW')">🗣️ 唸中文</button>
                <button class="action-btn btn-en" onclick="speakText('${item.en}', 'en-US')">🔤 唸英文</button>
                <button class="action-btn btn-next" onclick="nextQuestion()">➡️ 下一題</button>
            `;
        }

        const blurClass = isAnswerRevealed ? "" : "blur";

        card.innerHTML = `
            <div class="progress-text">第 ${currentIndex + 1} / ${currentList.length} 題</div>
            <div class="emoji-container ${blurClass}">
                ${item.emoji}
            </div>
            ${ansHtml}
            <div class="btn-group">${btnHtml}</div>
        `;
    }

    // 通關完成畫面
    function renderCompletion() {
        const card = document.getElementById('gameCard');
        card.innerHTML = `
            <div style="font-size: 5rem; margin: 20px 0;">🎉</div>
            <h2 style="color:#ff6b6b; margin: 10px 0;">太棒了！全數通關！</h2>
            <p style="color:#666; margin-bottom: 20px;">你已經挑戰完全部的題目囉！</p>
            <button class="action-btn btn-restart" onclick="changeCategory(currentCategory)">🔄 再玩一次（重新洗牌）</button>
        `;
    }

    // 頁面載入完成後初始化
    document.addEventListener("DOMContentLoaded", function() {
        const selectElem = document.getElementById('categorySelect');
        if (selectElem) {
            selectElem.addEventListener('change', function() {
                changeCategory(this.value);
            });
        }
        changeCategory('fruit');
    });
</script>

</body>
</html>
