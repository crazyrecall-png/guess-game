<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲與網頁入口</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            width: 100%;
        }

        .card-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.25rem 1rem;
            background-color: #1e293b;
            color: #e2e8f0;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid #334155;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.25s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .card-btn:hover {
            transform: translateY(-4px);
            background-color: #3b82f6;
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        .card-btn .subtext {
            font-size: 0.8rem;
            font-weight: normal;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        .card-btn:hover .subtext {
            color: #dbeafe;
        }

        footer {
            margin-top: 3rem;
            color: #64748b;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Guess Game Portal</h1>
        <p class="subtitle">請選擇你要進入的遊戲或網頁：</p>

        <div class="grid">
            <a href="Guess.html" class="card-btn">
                🎯 Guess
                <span class="subtext">Guess.html</span>
            </a>
            <a href="Rich.html" class="card-btn">
                💰 Rich
                <span class="subtext">Rich.html</span>
            </a>
            <a href="Rich-20.html" class="card-btn">
                💎 Rich 20
                <span class="subtext">Rich-20.html</span>
            </a>
            <a href="Rich-28.html" class="card-btn">
                🎲 Rich 28
                <span class="subtext">Rich-28.html</span>
            </a>
            <a href="Rich-Baby.html" class="card-btn">
                👶 Rich Baby
                <span class="subtext">Rich-Baby.html</span>
            </a>
            <a href="Rich-Man.html" class="card-btn">
                🎩 Rich Man
                <span class="subtext">Rich-Man.html</span>
            </a>
            <a href="Rich-Q.html" class="card-btn">
                ❓ Rich Q
                <span class="subtext">Rich-Q.html</span>
            </a>
        </div>
    </div>

    <footer>
        &copy; crazyrecall-png.github.io/guess-game
    </footer>

</body>
</html>
