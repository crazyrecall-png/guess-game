<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>遊戲抽抽樂</title>
  <!-- 引入可愛風格的字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #2b2b36;
      background-image: 
        radial-gradient(#4a4a60 15%, transparent 16%),
        radial-gradient(#4a4a60 15%, transparent 16%);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      color: #ffffff;
      font-family: 'ZCOOL KuaiLe', 'Mochiy Pop One', "微軟正黑體", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      margin: 0;
      padding: 20px;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      color: #ffde59;
      text-shadow: 
        4px 4px 0px #000,
        -2px -2px 0px #ff6699;
      margin: 10px 0 25px 0;
      text-align: center;
      letter-spacing: 3px;
    }

    /* iPad 與流動螢幕適應容器 */
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
    }

    /* 點陣風格卡片區域 */
    .card-container {
      perspective: 1000px;
      margin-bottom: 35px;
      touch-action: manipulation;
    }

    .card {
      width: clamp(220px, 40vw, 280px);
      height: clamp(340px, 55vw, 420px);
      background-color: #fff9e6;
      border: 8px solid #000000;
      border-radius: 16px;
      box-shadow: 
        8px 8px 0px 0px #ff6b81,
        14px 14px 0px 0px #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.15s ease-in-out;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(#ffd166 20%, transparent 20%);
      background-size: 16px 16px;
      opacity: 0.4;
      pointer-events: none;
    }

    .card.shuffling {
      animation: pixelShuffle 0.12s infinite alternate;
    }

    @keyframes pixelShuffle {
      0% {
        transform: scale(0.98) rotate(-4deg);
        box-shadow: 
          -8px 8px 0px 0px #4287f5,
          -14px 14px 0px 0px #000000;
      }
      100% {
        transform: scale(1.05) rotate(4deg);
        box-shadow: 
          8px -8px 0px 0px #ffbe0b,
          14px -14px 0px 0px #000000;
      }
    }

    .vertical-text {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: clamp(2.3rem, 5.5vw, 3.5rem);
      font-weight: bold;
      color: #ff3366;
      letter-spacing: 6px;
      text-shadow: 
        3px 3px 0px #ffffff,
        5px 5px 0px #000000;
      z-index: 2;
    }

    .draw-btn {
      background-color: #ffbe0b;
      color: #000000;
      font-family: 'ZCOOL KuaiLe', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: bold;
      padding: 16px 45px;
      border: 5px solid #000000;
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      box-shadow: 
        0px 8px 0px 0px #d48800,
        0px 14px 0px 0px #000000;
      transition: all 0.1s ease;
      touch-action: manipulation;
      outline: none;
    }

    .draw-btn:active {
      transform: translateY(6px);
      box-shadow: 
        0px 2px 0px 0px #d48800,
        0px 8px 0px 0px #000000;
    }

    .draw-btn:disabled {
      background-color: #a0a0a0;
      color: #555555;
      cursor: not-allowed;
      box-shadow: 0px 4px 0px 0px #000000;
      transform: translateY(4px);
    }

    .pixel-decor {
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      margin-bottom: 5px;
      animation: bounce 1.5s infinite alternate;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="pixel-decor">🎁 🎮 🌟</div>
    <h1>遊戲抽抽樂</h1>

    <div class="card-container">
      <div class="card" id="card">
        <div class="vertical-text" id="cardText">點擊抽取</div>
      </div>
    </div>

    <button class="draw-btn" id="drawBtn" onclick="drawCard()">抽取卡片！</button>
  </div>

  <script>
    // 10 個選項與自訂比重機率
    const options = [
      { text: "再來１次", weight: 10 },
      { text: "抽１顆", weight: 30 },
      { text: "扣１顆", weight: 30 },
      { text: "加＋１分", weight: 50 },
      { text: "加＋２分", weight: 30 },
      { text: "加＋三分", weight: 10 },
      { text: "減－１分", weight: 40 },
      { text: "減－２分", weight: 20 },
      { text: "減－３分", weight: 5 },
      { text: "沒有抽中", weight: 10 }
    ];

    const card = document.getElementById('card');
    const cardText = document.getElementById('cardText');
    const drawBtn = document.getElementById('drawBtn');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq, duration) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function playWinSound() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      try {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          setTimeout(() => playBeep(freq, 0.15), i * 100);
        });
      } catch(e) {}
    }

    // 加權機率抽取核心邏輯
    function getWeightedResult() {
      const totalWeight = options.reduce((sum, item) => sum + item.weight, 0);
      let randomNum = Math.random() * totalWeight;
      for (let i = 0; i < options.length; i++) {
        if (randomNum < options[i].weight) {
          return options[i].text;
        }
        randomNum -= options[i].weight;
      }
      return options[options.length - 1].text;
    }

    function drawCard() {
      drawBtn.disabled = true;
      card.classList.add('shuffling');

      let counter = 0;
      const shuffleSpeed = 80;
      const totalDuration = 1600;

      const interval = setInterval(() => {
        const randomIndex = Math.floor(Math.random() * options.length);
        cardText.innerText = options[randomIndex].text;
        playBeep(300 + Math.random() * 400, 0.05);
        counter += shuffleSpeed;

        if (counter >= totalDuration) {
          clearInterval(interval);
          
          const finalResult = getWeightedResult();
          cardText.innerText = finalResult;

          card.classList.remove('shuffling');
          playWinSound();
          drawBtn.disabled = false;
        }
      }, shuffleSpeed);
    }
  </script>
</body>
</html>
