<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>親子比手畫腳大考驗！</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
            background-color: #fff5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            background-color: white;
            padding: 25px 20px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 4px solid #ff9f1c;
            box-sizing: border-box;
            position: relative;
        }

        h1 {
            color: #ff6b6b;
            margin: 0 0 5px 0;
            font-size: 1.8rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 15px;
        }

        /* 下拉式選單 */
        .select-wrapper {
            margin-bottom: 20px;
        }

        .category-select {
            width: 100%;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            background-color: #fff0f5;
            border: 3px solid #ff9f1c;
            border-radius: 16px;
            outline: none;
            cursor: pointer;
            text-align: center;
        }

        /* 遊戲卡片區域 */
        .game-card {
            background: #fcfcfc;
            border: 3px dashed #ffcfd2;
            border-radius: 20px;
            padding: 20px 15px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .progress-text {
            font-size: 1rem;
            font-weight: bold;
            color: #3a86ff;
            background: #eef4ff;
            padding: 4px 12px;
            border-radius: 12px;
        }

        .q-emoji {
            font-size: 7.5rem;
            margin: 15px 0;
            line-height: 1;
            animation: pop 0.4s ease;
        }

        /* 答案區域 */
        .ans-box {
            width: 100%;
            margin-top: 10px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .zh-text {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 2px;
        }

        .en-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #3a86ff;
            margin-bottom: 10px;
        }

        .kk-text {
            font-size: 0.95rem;
            color: #666;
            font-weight: normal;
            margin-left: 5px;
        }

        /* 按鈕區 */
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 15px;
        }

        .action-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            transition: all 0.15s ease;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .btn-show { background: #ff006e; width: 100%; font-size: 1.1rem; padding: 12px; }
        .btn-zh { background: #ff9f1c; }
        .btn-en { background: #3a86ff; }
        .btn-next { background: #2ec4b6; font-size: 1rem; }
        .btn-restart { background: #ff6b6b; font-size: 1.1rem; padding: 12px 24px; }

        ruby { ruby-position: over; }
        rt { font-size: 0.85rem; color: #666; font-weight: normal; }

        @keyframes pop {
            0% { transform: scale(0.3); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

            { ans: "狗狗", zhuyin: "ㄍㄡˇ ㄍㄡˇ", en: "Dog", kk: "[dɔɡ]", icon: "🐶" }, 
            { ans: "貓咪", zhuyin: "ㄇㄠ ㄇㄧ", en: "Cat", kk: "[kæt]", icon: "🐱" }, 
            { ans: "袋鼠", zhuyin: "ㄉㄞˋ ㄕㄨˇ", en: "Kangaroo", kk: "[ˌkæŋɡəˈru]", icon: "🦘" }, 
            { ans: "猴子", zhuyin: "ㄏㄡˊ ㄗ˙", en: "Monkey", kk: "[ˈmʌŋki]", icon: "🐵" }
        ],
        water: [
            { ans: "鯨魚", zhuyin: "ㄐㄧㄥ ㄩˊ", en: "Whale", kk: "[hwel]", icon: "🐳" }, 
            { ans: "海豚", zhuyin: "ㄏㄞˇ ㄊㄨㄣˊ", en: "Dolphin", kk: "[ˈdɑlfɪn]", icon: "🐬" }, 
            { ans: "鯊魚", zhuyin: "ㄕㄚ ㄩˊ", en: "Shark", kk: "[ʃɑrk]", icon: "🦈" }, 
            { ans: "章魚", zhuyin: "ㄓㄤ ㄩˊ", en: "Octopus", kk: "[ˈɑktəpəs]", icon: "🐙" },

    // 遊戲狀態變數
    let currentCategory = 'fruit';
    let currentList = [];
    let currentIndex = 0;
    let isAnswerRevealed = false;

    // 洗牌演算法
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // 語音朗讀函數
    function speakText(text, lang) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("您的裝置不支援語音朗讀！");
        }
    }

    // 初始化/切換主題
    function changeCategory(cat) {
        currentCategory = cat;
        currentList = shuffle([...gameData[cat]]);
        currentIndex = 0;
        isAnswerRevealed = false;
        renderCard();
    }

    // 顯示答案
    function revealAnswer() {
        isAnswerRevealed = true;
        renderCard();
    }

    // 下一題
    function nextQuestion() {
        if (currentIndex < currentList.length - 1) {
            currentIndex++;
            isAnswerRevealed = false;
            renderCard();
        } else {
            // 通關畫面
            renderCompletion();
        }
    }

    // 渲染遊戲卡片
    function renderCard() {
        const item = currentList[currentIndex];
        const card = document.getElementById('gameCard');

        let ansHtml = '';
        let btnHtml = '';

        if (!isAnswerRevealed) {
            ansHtml = `<div class="ans-box"><p style="color:#aaa; font-weight:bold;">猜猜看這 localized 是什麼？</p></div>`;
            btnHtml = `<button class="action-btn btn-show" onclick="revealAnswer()">💡 顯示答案</button>`;
        } else {
            ansHtml = `
                <div class="ans-box">
                    <div class="zh-text"><ruby>${item.ans}<rt>(${item.zhuyin})</rt></ruby></div>
                    <div class="en-text">${item.en} <span class="kk-text">${item.kk}</span></div>
                </div>
            `;
            btnHtml = `
                <button class="action-btn btn-zh" onclick="speakText('${item.ans}', 'zh-TW')">🗣️ 唸中文</button>
                <button class="action-btn btn-en" onclick="speakText('${item.en}', 'en-US')">🔤 唸英文</button>
                <button class="action-btn btn-next" onclick="nextQuestion()">➡️ 下一題</button>
            `;
        }

        card.innerHTML = `
            <div class="progress-text">第 ${currentIndex + 1} / ${currentList.length} 題</div>
            <div class="q-emoji">${item.icon}</div>
            ${ansHtml}
            <div class="btn-group">${btnHtml}</div>
        `;
    }

    // 渲染通關完成畫面
    function renderCompletion() {
        const card = document.getElementById('gameCard');
        card.innerHTML = `
            <div class="q-emoji">🎉</div>
            <h2 style="color:#ff6b6b; margin: 10px 0;">太棒了！全數通關！</h2>
            <p style="color:#666; margin-bottom: 20px;">你已經挑戰完全部的題目囉！</p>
            <button class="action-btn btn-restart" onclick="changeCategory(currentCategory)">🔄 再玩一次（重新洗牌）</button>
        `;
    }

    // 頁面載入時初始化
    window.onload = function() {
        changeCategory('fruit');
    };
</script>
