<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>可愛風俄羅斯方塊 🧩</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Fredoka', 'Chalkboard SE', 'Comic Sans MS', sans-serif;
        }

        body {
            background-color: #fce4ec;
            background-image: radial-gradient(#f8bbd0 10%, transparent 11%);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            color: #4a4a4a;
        }

        .game-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(240, 98, 146, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            width: 100%;
            border: 4px solid #f48fb1;
        }

        h1 {
            margin: 0 0 15px 0;
            color: #ec407a;
            font-size: 28px;
            text-shadow: 2px 2px 0px #f8bbd0;
        }

        .main-layout {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
        }

        /* 遊戲主要畫布 - 加大版面 */
        #tetris {
            border: 4px solid #f8bbd0;
            border-radius: 16px;
            background-color: #fffafc;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        /* 右側資訊區 */
        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 130px;
        }

        .card {
            background: #f8bbd0;
            border-radius: 16px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 0 #f48fb1;
            color: #880e4f;
        }

        .card label {
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        .card .value {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 1px 1px 0 #c2185b;
        }

        #next-canvas {
            background: #fffafc;
            border-radius: 12px;
            border: 2px solid #f48fb1;
            margin-top: 5px;
        }

        /* 手機與滑鼠按鈕區 */
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        .btn {
            background: #ffb74d;
            border: none;
            border-bottom: 4px solid #f57c00;
            border-radius: 16px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 0;
            flex: 1;
            max-width: 90px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.05s, background-color 0.1s;
            touch-action: manipulation;
        }

        .btn:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
            box-shadow: none;
        }

        .btn-rotate { background: #ba68c8; border-color: #7b1fa2; }
        .btn-drop { background: #4dd0e1; border-color: #0097a7; flex: 2; max-width: 190px;}

        /* 動態提示訊息 */
        #combo-msg {
            height: 24px;
            font-weight: bold;
            color: #ff4081;
            font-size: 16px;
            margin-bottom: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🧩 可愛方塊大挑戰</h1>
    
    <div id="combo-msg"></div>

    <div class="main-layout">
        <!-- 主畫布：寬240 x 高480 (10x20格，每格24px) -->
        <canvas id="tetris" width="240" height="480"></canvas>

        <!-- 資訊區域 -->
        <div class="info-panel">
            <div class="card">
                <label>下一個</label>
                <canvas id="next-canvas" width="80" height="80"></canvas>
            </div>
            <div class="card">
                <label>目前分數</label>
                <div class="value" id="score">0</div>
            </div>
            <div class="card">
                <label>目前難度</label>
                <div class="value" id="level">Lv. 1</div>
            </div>
        </div>
    </div>

    <!-- 螢幕觸控 / 滑鼠點擊控制按鈕 -->
    <div class="controls">
        <div class="btn-row">
            <button class="btn btn-rotate" id="btn-up">↻ 旋轉</button>
        </div>
        <div class="btn-row">
            <button class="btn" id="btn-left">←</button>
            <button class="btn" id="btn-down">↓ 加速</button>
            <button class="btn" id="btn-right">→</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-drop" id="btn-space">⚡ 直接到底 ⚡</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextContext = nextCanvas.getContext('2d');

    const BLOCK_SIZE = 24; // 每格大小 (加大版面)
    context.scale(BLOCK_SIZE, BLOCK_SIZE);
    nextContext.scale(20, 20); // 預覽畫布縮放

    // 可愛馬卡龍色系
    const COLORS = [
        null,
        '#ff80ab', // 粉紅 (I)
        '#ffd54f', // 亮黃 (O)
        '#b388ff', // 淺紫 (T)
        '#81c784', // 蘋果綠 (S)
        '#ff8a65', // 珊瑚橘 (Z)
        '#4fc3f7', // 天藍 (J)
        '#a1887f'  // 奶茶棕 (L)
    ];

    // 方塊形狀定義
    function createPiece(type) {
        if (type === 'I') {
            return [
                [0, 1, 0, 0],
                [0, 1, 0, 0],
                [0, 1, 0, 0],
                [0, 1, 0, 0],
            ];
        } else if (type === 'O') {
            return [
                [2, 2],
                [2, 2],
            ];
        } else if (type === 'T') {
            return [
                [0, 3, 0],
                [3, 3, 3],
                [0, 0, 0],
            ];
        } else if (type === 'S') {
            return [
                [0, 4, 4],
                [4, 4, 0],
                [0, 0, 0],
            ];
        } else if (type === 'Z') {
            return [
                [5, 5, 0],
                [0, 5, 5],
                [0, 0, 0],
            ];
        } else if (type === 'J') {
            return [
                [0, 6, 0],
                [0, 6, 0],
                [6, 6, 0],
            ];
        } else if (type === 'L') {
            return [
                [0, 7, 0],
                [0, 7, 0],
                [0, 7, 7],
            ];
        }
    }

    // 建立 10x20 地圖陣列
    function createMatrix(w, h) {
        const matrix = [];
        while (h--) {
            matrix.push(new Array(w).fill(0));
        }
        return matrix;
    }

    const arena = createMatrix(10, 20);

    const player = {
        pos: {x: 0, y: 0},
        matrix: null,
        nextMatrix: null,
        score: 0,
        level: 1,
    };

    let dropCounter = 0;
    let dropInterval = 1000; // 起始速度 1 秒 (1000ms)
    let lastTime = 0;

    // 隨機獲取方塊名稱
    const pieces = 'IOTSZJL';
    function getRandomPiece() {
        return createPiece(pieces[pieces.length * Math.random() | 0]);
    }

    // 繪製格線輔助網格
    function drawGrid(ctx, width, height) {
        ctx.strokeStyle = '#f8bbd0'; // 粉粉的格線顏色
        ctx.lineWidth = 0.03;       // 細格線

        // 垂直線
        for (let x = 0; x <= width; x++) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
        }

        // 水平線
        for (let y = 0; y <= height; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }
    }

    // 繪製圓角方塊 (讓視覺更可愛)
    function drawRoundedRect(ctx, x, y, width, height, radius, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x + 0.05, y + 0.05, width - 0.1, height - 0.1, radius);
        ctx.fill();
        // 內邊框亮色（微立體感）
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 0.1;
        ctx.stroke();
    }

    // 繪製矩陣
    function drawMatrix(matrix, offset, ctx = context) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    drawRoundedRect(ctx, x + offset.x, y + offset.y, 1, 1, 0.2, COLORS[value]);
                }
            });
        });
    }

    // 繪製畫面
    function draw() {
        // 主遊戲區清空與格線繪製
        context.fillStyle = '#fffafc';
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawGrid(context, 10, 20); // 10x20 格線

        drawMatrix(arena, {x: 0, y: 0});
        drawMatrix(player.matrix, player.pos);

        // 右側「下一個方塊」清空與格線繪製
        nextContext.fillStyle = '#fffafc';
        nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        drawGrid(nextContext, 4, 4); // 預覽區 4x4 格線

        if (player.nextMatrix) {
            // 置中計算
            const offsetX = (4 - player.nextMatrix[0].length) / 2;
            const offsetY = (4 - player.nextMatrix.length) / 2;
            drawMatrix(player.nextMatrix, {x: offsetX, y: offsetY}, nextContext);
        }
    }

    // 碰撞偵測
    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 &&
                   (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    // 將落下的方塊固定到地圖中
    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    // 清除滿行與計算獎勵分數
    function arenaSweep() {
        let rowCount = 0;
        outer: for (let y = arena.length - 1; y >= 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) {
                    continue outer;
                }
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            rowCount++;
        }

        if (rowCount > 0) {
            // 多行消除額外獎勵公式：1行=100, 2行=300, 3行=600, 4行(Tetris)=1000
            const baseScores = [0, 100, 300, 600, 1000];
            const addedScore = baseScores[rowCount] || rowCount * 250;
            player.score += addedScore;

            // 顯示文字特效
            showComboMsg(rowCount);

            // 更新難度與速度 (每 500 分升一級，速度加快)
            player.level = Math.floor(player.score / 500) + 1;
            dropInterval = Math.max(150, 1000 - (player.level - 1) * 100);

            updateScoreUI();
        }
    }

    // 顯示連消獎勵訊息
    function showComboMsg(count) {
        const msgEl = document.getElementById('combo-msg');
        const msgs = ['', '不錯喔！ +100', '太棒了！ +300', '超級厲害！ +600', '🎉 完美清空 Tetris! +1000'];
        msgEl.innerText = msgs[count] || `一次消除 ${count} 行！`;
        setTimeout(() => {
            msgEl.innerText = '';
        }, 1500);
    }

    // 方塊旋轉 (矩陣翻轉)
    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) {
            matrix.forEach(row => row.reverse());
        } else {
            matrix.reverse();
        }
    }

    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        // 旋轉踢牆 (防止卡在邊界外)
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }

    function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
            player.pos.x -= dir;
        }
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
        }
        dropCounter = 0;
    }

    // 空白鍵：直接降到底部 (Hard Drop)
    function playerHardDrop() {
        while (!collide(arena, player)) {
            player.pos.y++;
        }
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        dropCounter = 0;
    }

    function playerReset() {
        if (!player.nextMatrix) {
            player.nextMatrix = getRandomPiece();
        }
        player.matrix = player.nextMatrix;
        player.nextMatrix = getRandomPiece();
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

        // 遊戲結束判定
        if (collide(arena, player)) {
            alert(`遊戲結束！\n您的最終得分是：${player.score}`);
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.level = 1;
            dropInterval = 1000;
            updateScoreUI();
        }
    }

    function updateScoreUI() {
        document.getElementById('score').innerText = player.score;
        document.getElementById('level').innerText = `Lv. ${player.level}`;
    }

    // 遊戲主循環
    function update(time = 0) {
        const deltaTime = time - lastTime;
        lastTime = time;

        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
            playerDrop();
        }

        draw();
        requestAnimationFrame(update);
    }

    // 鍵盤操控設定
    document.addEventListener('keydown', event => {
        if (event.keyCode === 37) { // 左
            playerMove(-1);
        } else if (event.keyCode === 39) { // 右
            playerMove(1);
        } else if (event.keyCode === 40) { // 下 (加速)
            playerDrop();
        } else if (event.keyCode === 38) { // 上 (旋轉)
            playerRotate(1);
        } else if (event.keyCode === 32) { // 空白鍵 (直接到底)
            event.preventDefault(); // 防止網頁捲動
            playerHardDrop();
        }
    });

    // 觸控與滑鼠點擊支援 (適用手機與滑鼠)
    function bindBtn(id, action) {
        const btn = document.getElementById(id);
        const handleEvent = (e) => {
            e.preventDefault();
            action();
        };
        btn.addEventListener('touchstart', handleEvent, { passive: false });
        btn.addEventListener('click', handleEvent);
    }

    bindBtn('btn-up', () => playerRotate(1));
    bindBtn('btn-left', () => playerMove(-1));
    bindBtn('btn-right', () => playerMove(1));
    bindBtn('btn-down', () => playerDrop());
    bindBtn('btn-space', () => playerHardDrop());

    // 初始化遊戲
    playerReset();
    updateScoreUI();
    update();
</script>

</body>
</html>
