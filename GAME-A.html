<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移動式圈圈叉叉 - 兒童多模式版</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px 0;
      min-height: 100vh;
      
      background: #fdf2f8;
      background-image:
        radial-gradient(#fecdd3 10%, transparent 10%),
        radial-gradient(#fee2e2 15%, transparent 15%);
      background-position: 0 0, 30px 30px;
      background-size: 60px 60px;
      
      font-family: "Noto Sans TC", "Microsoft JhengHei", cursive, sans-serif;
      color: #333;
      overflow: auto;
    }

    .game-container {
      width: 480px;
      min-height: 760px;
      padding: 24px;
      text-align: center;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 40px;
      border: 10px solid #f9a8d4; 
      box-shadow: 0 15px 30px rgba(244, 114, 182, 0.2);
    }

    h1 {
      margin: 0 0 12px;
      color: #be185d;
      font-size: 32px;
      text-shadow: 2px 2px 0px #fecdd3;
    }

    /* 模式選擇區塊 */
    .mode-selector {
      background: #fff1f2;
      border: 2px dashed #fda4af;
      border-radius: 20px;
      padding: 12px;
      margin-bottom: 16px;
      text-align: left;
    }

    .mode-title {
      font-size: 15px;
      font-weight: bold;
      color: #be185d;
      margin-bottom: 8px;
      text-align: center;
    }

    .mode-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: #881337;
    }

    .mode-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .mode-options input[type="radio"] {
      accent-color: #be185d;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* 規則面板 */
    .rules {
      padding: 10px 14px;
      margin-bottom: 12px;
      background: #fce7f3;
      border-radius: 16px;
      color: #831843;
      font-size: 14px;
      line-height: 1.6;
    }

    .status-container {
      height: 36px;
      margin: 10px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .status {
      font-size: 20px;
      font-weight: bold;
      color: #9333ea;
      padding: 4px 16px;
      border-radius: 15px;
      transition: all 0.3s ease;
    }

    .status.win {
      background: #ec4899;
      color: #ffffff;
      transform: scale(1.1);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1.1); }
      50% { transform: scale(1.15); }
    }

    .score {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin: 10px 0 16px;
      font-size: 16px;
    }

    .score-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
    }

    .x-score { color: #dc2626; border: 2px solid #fecaca; }
    .o-score { color: #2563eb; border: 2px solid #bfdbfe; }
    .count { font-weight: bold; font-size: 18px; }

    /* 棋盤大改造 */
    .board-container {
      position: relative;
      width: 360px;
      height: 360px;
      margin: 10px auto;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      height: 100%;
      padding: 12px;
      background: #dbeafe;
      border-radius: 25px;
      box-shadow: inset 0 3px 10px rgba(0,0,0,0.1);
      position: relative;
      z-index: 2;
    }

    .cell {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
      background: #ffffff;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 0px #e0e0e0;
      z-index: 3;
    }

    .cell:hover:not(.x):not(.o) {
      background: #f0f9ff;
      transform: translateY(-2px);
    }

    .cell.x, .cell.o {
      cursor: pointer;
      position: relative;
    }

    .cell.x::after, .cell.o::after {
      content: "";
      position: absolute;
      width: 80%;
      height: 80%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    /* 可愛卡通圖案 */
    .cell.x::after {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23fee2e2" stroke="%23dc2626" stroke-width="6"/><path d="M30,30 L70,70 M70,30 L30,70" stroke="%23dc2626" stroke-width="12" stroke-linecap="round"/><circle cx="35" cy="40" r="5" fill="%23333"/><circle cx="65" cy="40" r="5" fill="%23333"/><path d="M40,70 Q50,80 60,70" stroke="%23333" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M40,10 L50,0 L60,10 M40,10 L60,10" fill="%23fbbf24" stroke="%23333" stroke-width="2" stroke-linejoin="round"/></svg>');
    }

    .cell.o::after {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23dbeafe" stroke="%232563eb" stroke-width="6"/><circle cx="35" cy="40" r="8" fill="white" stroke="%232563eb" stroke-width="3"/><circle cx="35" cy="40" r="4" fill="%232563eb"/><circle cx="65" cy="40" r="8" fill="white" stroke="%232563eb" stroke-width="3"/><circle cx="65" cy="40" r="4" fill="%232563eb"/><path d="M40,70 Q50,80 60,70" stroke="%232563eb" stroke-width="5" fill="none" stroke-linecap="round"/></svg>');
    }

    /* 選取跳動動畫 */
    .cell.selected {
      outline: 6px solid #fbbf24;
      background: #fef3c7;
      animation: selectDance 0.5s ease infinite;
    }

    @keyframes selectDance {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08) translateY(-5px); }
    }

    .reset-button {
      border: none;
      border-radius: 25px;
      padding: 12px 28px;
      background: #be185d;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 #831843;
      margin: 12px auto 0;
    }

    .reset-button:hover {
      background: #ec4899;
      transform: translateY(-2px);
    }

    .reset-button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #be185d;
    }
  </style>
</head>

<body>
  <main class="game-container">
    <h1>移動式圈圈叉叉</h1>

    <div class="mode-selector">
      <div class="mode-title">🎮 選擇移動規則：</div>
      <div class="mode-options">
        <label>
          <input type="radio" name="moveMode" value="free" checked onchange="changeMode()">
          <span><b>任意移動</b>：可以飛到棋盤上任何空格（最簡單）</span>
        </label>
        <label>
          <input type="radio" name="moveMode" value="orthogonal" onchange="changeMode()">
          <span><b>鄰近移動</b>：只能移到上下左右的空格</span>
        </label>
        <label>
          <input type="radio" name="moveMode" value="diagonal" onchange="changeMode()">
          <span><b>鄰近移動（含斜角）</b>：可移到周圍 8 個相鄰空格</span>
        </label>
      </div>
    </div>

    <div class="rules" id="ruleText">
      雙方輪流放置 3 個卡通棋子。放滿後，可以任意移動棋子到空格！
    </div>

    <div class="status-container">
      <div id="status" class="status"></div>
    </div>

    <div class="score">
      <div class="score-item x-score">
        ❌ <span class="count" id="xCount">0</span> / 3
      </div>
      <div class="score-item o-score">
        ⭕ <span class="count" id="oCount">0</span> / 3
      </div>
    </div>

    <div class="board-container">
      <div id="board" class="board"></div>
    </div>

    <button id="resetButton" class="reset-button" onclick="resetGame()">
      ↺ 重新開始
    </button>
  </main>

  <script>
    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");
    const ruleText = document.getElementById("ruleText");
    const xCountElement = document.getElementById("xCount");
    const oCountElement = document.getElementById("oCount");

    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    // 相鄰位置定義 (0 ~ 8 九宮格)
    const neighborsMap = {
      // 僅上下左右
      orthogonal: {
        0: [1, 3],
        1: [0, 2, 4],
        2: [1, 5],
        3: [0, 4, 6],
        4: [1, 3, 5, 7],
        5: [2, 4, 8],
        6: [3, 7],
        7: [4, 6, 8],
        8: [5, 7]
      },
      // 上下左右 + 斜角 (周圍 8 格)
      diagonal: {
        0: [1, 3, 4],
        1: [0, 2, 3, 4, 5],
        2: [1, 4, 5],
        3: [0, 1, 4, 6, 7],
        4: [0, 1, 2, 3, 5, 6, 7, 8],
        5: [1, 2, 4, 7, 8],
        6: [3, 4, 7],
        7: [3, 4, 5, 6, 8],
        8: [4, 5, 7]
      }
    };

    let board = [];
    let currentPlayer = "X";
    let phase = "placing";
    let selectedIndex = null;
    let gameOver = false;
    let currentMode = "free";

    // --- 音效系統 (使用 Web Audio API 自動合成) ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'place') {
        // 放置棋子：木頭叩擊聲
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);

      } else if (type === 'select') {
        // 選擇棋子：清脆提醒音
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.05); // E5
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);

      } else if (type === 'move') {
        // 移動棋子：滑音效果（解決沉悶感）
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);

      } else if (type === 'win') {
        // 獲勝音效：歡樂音樂短句
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, index) => {
          const noteOsc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          noteOsc.type = 'triangle';
          noteOsc.frequency.setValueAtTime(freq, now + index * 0.08);
          noteGain.gain.setValueAtTime(0.3, now + index * 0.08);
          noteGain.gain.exponentialRampToValueAtTime(0.01, now + index * 0.08 + 0.2);
          noteOsc.connect(noteGain);
          noteGain.connect(audioCtx.destination);
          noteOsc.start(now + index * 0.08);
          noteOsc.stop(now + index * 0.08 + 0.2);
        });
      }
    }

    // 變更模式
    function changeMode() {
      const selected = document.querySelector('input[name="moveMode"]:checked').value;
      currentMode = selected;

      if (currentMode === "free") {
        ruleText.textContent = "雙方輪流放置 3 個卡通棋子。放滿後，可以任意移動棋子到空格！";
      } else if (currentMode === "orthogonal") {
        ruleText.textContent = "雙方輪流放置 3 個卡通棋子。放滿後，只能移到「上下左右」相鄰空格！";
      } else if (currentMode === "diagonal") {
        ruleText.textContent = "雙方輪流放置 3 個卡通棋子。放滿後，可以移到「周圍 8 個相鄰空格（含斜角）」！";
      }

      resetGame();
    }

    function resetGame() {
      board = Array(9).fill(null);
      currentPlayer = "X";
      phase = "placing";
      selectedIndex = null;
      gameOver = false;

      statusElement.classList.remove("win");
      render();
      updateStatus();
    }

    function render() {
      boardElement.innerHTML = "";

      board.forEach((value, index) => {
        const cell = document.createElement("button");
        cell.className = "cell";

        if (value === "X") cell.classList.add("x");
        if (value === "O") cell.classList.add("o");
        if (index === selectedIndex) cell.classList.add("selected");

        cell.addEventListener("click", function () {
          handleCellClick(index);
        });

        boardElement.appendChild(cell);
      });

      xCountElement.textContent = board.filter(v => v === "X").length;
      oCountElement.textContent = board.filter(v => v === "O").length;
    }

    function updateStatus(message = "") {
      if (message) {
        statusElement.textContent = message;
        return;
      }

      if (gameOver) return;

      const playerName = currentPlayer === "X" ? "❌ 小紅" : "⭕ 小藍";

      if (phase === "placing") {
        statusElement.textContent = `${playerName}，換你放囉！😊`;
      } else {
        if (selectedIndex === null) {
          statusElement.textContent = `${playerName}，請選擇要移動的棋子`;
        } else {
          statusElement.textContent = "請選擇可移動的空格 🚚";
        }
      }
    }

    function handleCellClick(index) {
      if (gameOver) return;

      if (phase === "placing") {
        placePiece(index);
      } else {
        movePiece(index);
      }
    }

    function placePiece(index) {
      if (board[index] !== null) {
        updateStatus("這個位置已經有棋子了！");
        return;
      }

      board[index] = currentPlayer;
      playSound('place');

      if (checkWin(currentPlayer)) {
        endGame(currentPlayer);
        return;
      }

      const xCount = board.filter(v => v === "X").length;
      const oCount = board.filter(v => v === "O").length;

      if (xCount === 3 && oCount === 3) {
        phase = "moving";
      }

      switchPlayer();
      render();
      updateStatus();
    }

    function movePiece(index) {
      // 1. 還沒選取要移動的棋子
      if (selectedIndex === null) {
        if (board[index] !== currentPlayer) {
          updateStatus("請選擇你自己的棋子！");
          return;
        }
        selectedIndex = index;
        playSound('select');
        render();
        updateStatus();
        return;
      }

      // 2. 重新點擊自己的其他棋子（切換選擇）
      if (board[index] === currentPlayer) {
        selectedIndex = index;
        playSound('select');
        render();
        updateStatus();
        return;
      }

      // 3. 點擊目的地 (必須是空格)
      if (board[index] !== null) {
        updateStatus("目的地必須是空格！");
        return;
      }

      // 4. 檢查移動規則
      if (currentMode !== "free") {
        const allowedNeighbors = neighborsMap[currentMode][selectedIndex];
        if (!allowedNeighbors.includes(index)) {
          updateStatus("不行這樣走！只能移到相鄰的空格喔！");
          return;
        }
      }

      // 執行移動
      board[index] = currentPlayer;
      board[selectedIndex] = null;
      selectedIndex = null;
      
      playSound('move'); // 播放滑動移動聲

      if (checkWin(currentPlayer)) {
        endGame(currentPlayer);
        return;
      }

      switchPlayer();
      render();
      updateStatus();
    }

    function endGame(player) {
      gameOver = true;
      const playerSymbol = player === "X" ? "❌ 小紅" : "⭕ 小藍";
      
      playSound('win');
      statusElement.classList.add("win");
      
      render();
      updateStatus(`🎉 太棒了！${playerSymbol} 玩家獲勝！🎉`);
    }

    function switchPlayer() {
      currentPlayer = currentPlayer === "X" ? "O" : "X";
    }

    function checkWin(player) {
      return winningLines.some(line => line.every(index => board[index] === player));
    }

    // 初始化
    resetGame();
  </script>
</body>
</html>
