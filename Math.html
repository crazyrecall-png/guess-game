<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff8fa3">
  <title>數學冒險王 👑</title>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ffe5ec 0%, #fff0f5 50%, #e8dff5 100%);
      --card: #ffffffd0;
      --text: #5a3d5c;
      --muted: #8e6c8f;
      --main: #ff7597;
      --main-dark: #e05275;
      --good: #43c59e;
      --bad: #ff6b6b;
      --gold: #ffc038;
      --line: #ffe5ec;
      --shadow: 0 8px 25px rgba(255, 117, 151, 0.2);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      color: var(--text);
      background: var(--bg-gradient);
      background-attachment: fixed;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 3px solid #ff7597;
      outline-offset: 3px;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      white-space: nowrap;
      color: #d81159;
      text-shadow: 2px 2px 0px #fff;
    }

    .stats {
      display: flex;
      gap: 8px;
    }

    .pill {
      padding: 8px 14px;
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(216, 17, 89, 0.15);
      font-size: 15px;
      font-weight: bold;
      color: #ff477e;
      border: 2px solid #ffccd5;
      white-space: nowrap;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .hero {
      margin-bottom: 16px;
      padding: 24px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
      border: 3px solid #fff;
      backdrop-filter: blur(5px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.25;
      color: #ff477e;
    }

    h2 {
      margin: 4px 0 14px;
      line-height: 1.3;
      color: #8338ec;
    }

    p {
      margin-top: 0;
    }

    .sub {
      color: var(--muted);
      line-height: 1.65;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stage {
      min-height: 155px;
      padding: 16px;
      border-radius: 24px;
      background: #ffffff;
      text-align: left;
      box-shadow: 0 6px 15px rgba(0,0,0,0.05);
      border: 3px solid #ffe5ec;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .stage:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(255, 117, 151, 0.25);
    }

    .stage:active {
      transform: scale(0.98);
    }

    .stage.lock {
      opacity: 0.5;
      filter: grayscale(60%);
    }

    .stage:disabled {
      cursor: not-allowed;
    }

    .emoji {
      margin-bottom: 6px;
      font-size: 36px;
    }

    .stage-title {
      display: block;
      margin-bottom: 5px;
      font-size: 18px;
      font-weight: 800;
      color: #ff477e;
    }

    .stage-desc {
      min-height: 42px;
    }

    .bar {
      height: 10px;
      overflow: hidden;
      border-radius: 8px;
      background: #ffe5ec;
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff7597, #ffb3c1);
      transition: width 0.25s ease;
    }

    .primary,
    .secondary {
      padding: 13px 18px;
      border-radius: 18px;
      font-weight: 800;
      font-size: 16px;
      transition: transform 0.15s, filter 0.15s;
      box-shadow: 0 4px 0px rgba(0,0,0,0.08);
    }

    .primary {
      color: #fff;
      background: linear-gradient(180deg, #ff7597 0%, #ff477e 100%);
    }

    .primary:hover {
      filter: brightness(1.05);
    }

    .secondary {
      color: #ff477e;
      background: #ffe5ec;
      border: 2px solid #ffb3c1;
    }

    .primary:active,
    .secondary:active {
      transform: scale(0.97);
    }

    .toprow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .toprow h2 {
      margin-bottom: 0;
    }

    .back {
      padding: 6px 14px;
      color: #ff477e;
      background: #ffe5ec;
      border-radius: 12px;
      font-weight: 700;
    }

    .qbox {
      padding: 10px 10px;
      text-align: center;
    }

    .tts-btn {
      background: #ffeb3b;
      border: 2px solid #fbc02d;
      border-radius: 50px;
      padding: 8px 18px;
      font-size: 16px;
      font-weight: bold;
      color: #5d4037;
      box-shadow: 0 3px 0 #fbc02d;
      margin-bottom: 12px;
      transition: transform 0.1s;
    }

    .tts-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #fbc02d;
    }

    .question {
      min-height: 48px;
      margin: 16px 0;
      font-size: 32px;
      font-weight: 900;
      line-height: 1.3;
      color: #6c5ce7;
    }

    .visual {
      min-height: 60px;
      font-size: 42px;
      line-height: 1.4;
      word-break: break-word;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .answer {
      min-height: 68px;
      padding: 15px;
      border-radius: 20px;
      color: var(--text);
      background: #ffffff;
      border: 3px solid #ffccd5;
      box-shadow: 0 5px 0px #ffccd5;
      font-size: 26px;
      font-weight: 800;
      transition: transform 0.15s, background 0.15s;
    }

    .answer:not(:disabled):hover {
      transform: translateY(-2px);
      background: #fff5f7;
    }

    .answer.correct {
      color: #fff;
      background: #43c59e;
      border-color: #25a17d;
      box-shadow: 0 4px 0px #25a17d;
    }

    .answer.wrong {
      color: #fff;
      background: #ff6b6b;
      border-color: #e04848;
      box-shadow: 0 4px 0px #e04848;
    }

    .feedback {
      min-height: 52px;
      padding: 12px;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
    }

    .feedback.good {
      color: var(--good);
    }

    .feedback.bad {
      color: var(--bad);
    }

    .center {
      text-align: center;
    }

    .big {
      font-size: 55px;
    }

    .progress {
      height: 14px;
      overflow: hidden;
      margin-top: 14px;
      border-radius: 99px;
      background: #ffe5ec;
    }

    .progress i {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffc038, #ff9f1c);
      transition: width 0.25s ease;
    }

    .modeBtns,
    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
    }

    .task-done {
      color: var(--good);
      font-weight: 800;
    }

    @keyframes popIn {
      0% {
        transform: scale(0.92);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (min-width: 600px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 480px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .logo {
        font-size: 24px;
      }

      .stats {
        width: 100%;
      }

      .pill {
        flex: 1;
        text-align: center;
      }

      .hero {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .question {
        font-size: 26px;
      }

      .visual {
        font-size: 36px;
      }

      .primary,
      .secondary {
        flex: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      <div class="logo">🧠 數學冒險王 👑</div>

      <div class="stats" aria-label="遊戲統計">
        <span class="pill">⭐ <span id="xp">0</span></span>
        <span class="pill">🏆 Lv.<span id="level">1</span></span>
      </div>
    </header>

    <!-- 首頁 -->
    <section id="home" class="screen active">
      <div class="hero">
        <h1>從 1 開始，成為數學大師！</h1>

        <p class="sub">
          包含 6 個學習世界。先建立數量感，
          再一路學到加減、乘除、幾何與百分比。
        </p>

        <div class="modeBtns">
          <button id="continueBtn" class="primary" type="button">
            ▶ 繼續冒險
          </button>

          <button id="chooseStageBtn" class="secondary" type="button">
            🗺️ 選擇階段
          </button>
        </div>
      </div>

      <div class="hero">
        <h2>🌟 今日任務</h2>
        <p id="daily" class="sub"></p>
      </div>
    </section>

    <!-- 階段地圖 -->
    <section id="stages" class="screen">
      <div class="hero">
        <div class="toprow">
          <h2>🗺️ 數學世界</h2>

          <button id="backHomeBtn" class="back" type="button">
            ← 返回
          </button>
        </div>

        <p class="sub">
          建議依序挑戰。完成前一階段至少 3 輪後，
          即可解鎖下一個世界。
        </p>
      </div>

      <div id="stageGrid" class="grid"></div>
    </section>

    <!-- 答題畫面 -->
    <section id="quiz" class="screen">
      <div class="hero">
        <div class="toprow">
          <button id="backStagesBtn" class="back" type="button">
            ← 階段
          </button>

          <b id="stageName" style="color: #ff477e;"></b>
          <span id="qnum" style="font-weight: bold; color: #8338ec;">1/5</span>
        </div>

        <div class="progress" aria-label="題目進度">
          <i id="qprog"></i>
        </div>

        <div class="qbox">
          <button id="speakBtn" class="tts-btn" type="button">🔊 唸題目給我聽</button>
          <div id="visual" class="visual" aria-live="polite"></div>
          <div id="question" class="question" aria-live="polite"></div>
          <div id="answers" class="answers"></div>
          <div id="feedback" class="feedback" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <!-- 結果畫面 -->
    <section id="result" class="screen">
      <div class="hero center">
        <div id="resultEmoji" class="big">🎉</div>

        <h1 id="resultTitle">完成！</h1>

        <p id="resultText" class="sub"></p>

        <p style="font-size: 18px;">
          本輪 XP：
          <b id="earned" style="color: #ffc038; font-size: 22px;">0</b> ⭐
        </p>

        <div class="result-actions">
          <button id="nextStageBtn" class="primary" type="button">
            下一關
          </button>

          <button id="resultStagesBtn" class="secondary" type="button">
            回到地圖
          </button>
        </div>
      </div>
    </section>

  </div>

  <script>
    "use strict";

    /*
      Web Audio API 動態音效合成器
    */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
        osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    /*
      SpeechSynthesis 語音朗讀 (TTS)
    */
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // 停止先前的朗讀

      let speakContent = text
        .replace(/＋|\+/g, " 加 ")
        .replace(/－|-/g, " 減 ")
        .replace(/×/g, " 乘以 ")
        .replace(/÷/g, " 除以 ")
        .replace(/=/g, " 等於 ")
        .replace(/\?/g, " 多少 ")
        .replace(/▭/g, "長方形")
        .replace(/%/g, "百分之")
        .replace(/(\d+)\/(\d+)/g, "$2分之$1"); // 將 1/2 轉為 2分之1

      const utterance = new SpeechSynthesisUtterance(speakContent);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.85; // 放慢語速
      utterance.pitch = 1.1; // 稍微拉高聲調顯得親切

      window.speechSynthesis.speak(utterance);
    }

    const STORAGE_KEY = "mathAdventureV2";
    const QUESTIONS_PER_ROUND = 5;
    const XP_PER_CORRECT = 20;

    const stages = [
      {
        id: 1,
        emoji: "🌱",
        name: "數量世界",
        desc: "多少、比較、分類、0～10"
      },
      {
        id: 2,
        emoji: "🔢",
        name: "數字世界",
        desc: "數數、位值、大小、0～100"
      },
      {
        id: 3,
        emoji: "➕",
        name: "加減村",
        desc: "加法、減法、未知數"
      },
      {
        id: 4,
        emoji: "✖️",
        name: "乘除城",
        desc: "重複加法、乘法、平均分配"
      },
      {
        id: 5,
        emoji: "📐",
        name: "幾何森林",
        desc: "長度、周長、面積"
      },
      {
        id: 6,
        emoji: "🧩",
        name: "分數王國",
        desc: "分數、小數、百分比"
      }
    ];

    const defaultState = {
      xp: 0,
      progress: [0, 0, 0, 0, 0, 0],
      best: 0,
      dailyDone: ""
    };

    let state = loadState();
    let currentStage = 0;
    let questionIndex = 0;
    let questions = [];
    let earnedXP = 0;
    let isAnswering = false;

    const $ = id => document.getElementById(id);

    /*
      基本工具
    */

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(array) {
      const result = [...array];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function getTodayKey() {
      const today = new Date();

      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function createOptions(answer, min = 0, max = null) {
      const options = new Set([answer]);

      if (max === null) {
        max = Math.max(answer + 10, 10);
      }

      while (options.size < 4) {
        const value = randomInt(min, max);

        if (value !== answer) {
          options.add(value);
        }
      }

      return shuffle([...options]);
    }

    /*
      LocalStorage
    */

    function loadState() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(STORAGE_KEY)
        );

        if (!saved || typeof saved !== "object") {
          return { ...defaultState };
        }

        const progress = stages.map((_, index) => {
          const value = Number(saved.progress?.[index]);

          if (!Number.isFinite(value)) {
            return 0;
          }

          return Math.min(5, Math.max(0, Math.floor(value)));
        });

        return {
          xp: Number.isFinite(Number(saved.xp))
            ? Math.max(0, Number(saved.xp))
            : 0,

          progress,

          best: Number.isFinite(Number(saved.best))
            ? Math.max(0, Number(saved.best))
            : 0,

          dailyDone: typeof saved.dailyDone === "string"
            ? saved.dailyDone
            : ""
        };
      } catch (error) {
        console.warn("遊戲資料讀取失敗，已使用預設資料。", error);
        return { ...defaultState };
      }
    }

    function saveState() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
      );

      updateHeader();
      renderStages();
    }

    /*
      畫面控制
    */

    function show(screenId) {
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });

      const target = $(screenId);

      if (!target) {
        return;
      }

      target.classList.add("active");
      updateHeader();

      if (screenId === "stages") {
        renderStages();
      }
    }

    function updateHeader() {
      $("xp").textContent = state.xp;
      $("level").textContent = 1 + Math.floor(state.xp / 100);

      const dailyCompleted = state.dailyDone === getTodayKey();

      $("daily").textContent = dailyCompleted
        ? "✅ 今日任務已完成，明天再來挑戰吧！"
        : "完成任一階段 1 輪，今天就算完成任務！";

      $("daily").classList.toggle(
        "task-done",
        dailyCompleted
      );
    }

    /*
      階段地圖
    */

    function isStageUnlocked(index) {
      if (index === 0) {
        return true;
      }

      return state.progress[index - 1] >= 3;
    }

    function renderStages() {
      const grid = $("stageGrid");

      if (!grid) {
        return;
      }

      grid.innerHTML = "";

      stages.forEach((stage, index) => {
        const unlocked = isStageUnlocked(index);
        const completed = state.progress[index];
        const percent = completed * 20;

        const button = document.createElement("button");

        button.type = "button";
        button.className = `stage ${unlocked ? "" : "lock"}`;
        button.disabled = !unlocked;

        button.innerHTML = `
          <div class="emoji">${stage.emoji}</div>
          <span class="stage-title">
            Lv.${stage.id} ${stage.name}
          </span>
          <div class="small stage-desc">${stage.desc}</div>
          <br>
          <div class="bar">
            <i style="width: ${percent}%"></i>
          </div>
          <div class="small">${completed}/5 輪完成</div>
        `;

        if (unlocked) {
          button.addEventListener("click", () => {
            playSound('click');
            startStage(index);
          });
        }

        grid.appendChild(button);
      });
    }

    function startRecommended() {
      let index = state.progress.findIndex(
        progress => progress < 5
      );

      if (index === -1) {
        index = stages.length - 1;
      }

      while (index > 0 && !isStageUnlocked(index)) {
        index--;
      }

      startStage(index);
    }

    /*
      完整保留原本的 6 大題型邏輯
    */

    function createQuantityQuestion() {
      let first = randomInt(1, 5);
      let second = randomInt(1, 5);

      while (first === second) {
        second = randomInt(1, 5);
      }

      const askMore = Math.random() < 0.5;
      const answer = askMore
        ? Math.max(first, second)
        : Math.min(first, second);

      return {
        visual: `${"🍎".repeat(first)}　　${"🍎".repeat(second)}`,
        text: askMore
          ? "比較多的是幾個蘋果？"
          : "比較少的是幾個蘋果？",
        answer,
        options: createOptions(answer, 1, 6)
      };
    }

    function createNumberQuestion() {
      let first = randomInt(1, 90);
      let second = randomInt(1, 90);

      while (first === second) {
        second = randomInt(1, 90);
      }

      const answer = Math.max(first, second);

      return {
        visual: "",
        text: `${first} 和 ${second}，哪個數字比較大？`,
        answer,
        options: createOptions(answer, 1, 100)
      };
    }

    function createAddSubtractQuestion() {
      const first = randomInt(1, 9);
      const second = randomInt(1, 9);
      const isAddition = Math.random() < 0.55;

      if (isAddition) {
        const answer = first + second;

        return {
          visual: "",
          text: `${first} + ${second} = ?`,
          answer,
          options: createOptions(answer, 0, 20)
        };
      }

      const larger = Math.max(first, second);
      const smaller = Math.min(first, second);
      const answer = larger - smaller;

      return {
        visual: "",
        text: `${larger} - ${smaller} = ?`,
        answer,
        options: createOptions(answer, 0, 12)
      };
    }

    function createMultiplicationQuestion() {
      const first = randomInt(2, 7);
      const second = randomInt(2, 6);
      const isMultiplication = Math.random() < 0.6;

      if (isMultiplication) {
        const answer = first * second;

        return {
          visual: "",
          text: `${first} × ${second} = ?`,
          answer,
          options: createOptions(answer, 1, 42)
        };
      }

      const dividend = first * second;

      return {
        visual: "",
        text: `${dividend} ÷ ${first} = ?`,
        answer: second,
        options: createOptions(second, 1, 12)
      };
    }

    function createGeometryQuestion() {
      const length = randomInt(2, 9);
      const width = randomInt(2, 9);
      const askArea = Math.random() < 0.5;

      if (askArea) {
        const answer = length * width;

        return {
          visual: "▭",
          text: `長 ${length}、寬 ${width}，面積是多少？`,
          answer,
          options: createOptions(answer, 1, 100)
        };
      }

      const answer = 2 * (length + width);

      return {
        visual: "▭",
        text: `長 ${length}、寬 ${width}，周長是多少？`,
        answer,
        options: createOptions(answer, 1, 40)
      };
    }

    function createFractionQuestion() {
      const denominators = [2, 4, 5, 10];
      const denominator =
        denominators[randomInt(0, denominators.length - 1)];

      const numerator = randomInt(1, denominator - 1);
      const answer = (numerator / denominator) * 100;

      return {
        visual: "🍰",
        text: `${numerator}/${denominator} = 幾 %？`,
        answer,
        options: createOptions(answer, 1, 100)
      };
    }

    function createQuestion(stageIndex) {
      switch (stageIndex) {
        case 0:
          return createQuantityQuestion();

        case 1:
          return createNumberQuestion();

        case 2:
          return createAddSubtractQuestion();

        case 3:
          return createMultiplicationQuestion();

        case 4:
          return createGeometryQuestion();

        case 5:
          return createFractionQuestion();

        default:
          return createAddSubtractQuestion();
      }
    }

    function makeQuestions(stageIndex) {
      return Array.from(
        { length: QUESTIONS_PER_ROUND },
        () => createQuestion(stageIndex)
      );
    }

    /*
      遊戲流程
    */

    function startStage(index) {
      if (!isStageUnlocked(index)) {
        return;
      }

      currentStage = index;
      questionIndex = 0;
      earnedXP = 0;
      isAnswering = false;
      questions = makeQuestions(index);

      $("stageName").textContent =
        `${stages[index].emoji} ${stages[index].name}`;

      show("quiz");
      renderQuestion();
    }

    function speakCurrentQuestion() {
      const question = questions[questionIndex];
      if (!question) return;

      let speechText = `${question.text}。選項有：`;
      question.options.forEach((opt, idx) => {
        speechText += `第 ${idx + 1} 個選項，${opt}。`;
      });

      speakText(speechText);
    }

    function renderQuestion() {
      const question = questions[questionIndex];

      if (!question) {
        return;
      }

      $("qnum").textContent =
        `${questionIndex + 1}/${QUESTIONS_PER_ROUND}`;

      $("qprog").style.width =
        `${(questionIndex / QUESTIONS_PER_ROUND) * 100}%`;

      $("visual").textContent = question.visual;
      $("question").textContent = question.text;

      const feedback = $("feedback");
      feedback.textContent = "";
      feedback.className = "feedback";

      const answers = $("answers");
      answers.innerHTML = "";

      question.options.forEach(option => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "answer";
        button.textContent = option;
        button.dataset.value = option;

        button.addEventListener("click", () => {
          speakText(`${option}`);
          handleAnswer(option, button);
        });

        answers.appendChild(button);
      });

      // 自動朗讀題目
      speakCurrentQuestion();
    }

    function handleAnswer(selectedAnswer, selectedButton) {
      if (isAnswering) {
        return;
      }

      isAnswering = true;

      const question = questions[questionIndex];
      const isCorrect = selectedAnswer === question.answer;
      const feedback = $("feedback");

      document.querySelectorAll("#answers .answer").forEach(button => {
        button.disabled = true;

        if (Number(button.dataset.value) === question.answer) {
          button.classList.add("correct");
        }
      });

      if (isCorrect) {
        playSound('correct');
        earnedXP += XP_PER_CORRECT;
        state.xp += XP_PER_CORRECT;

        feedback.textContent =
          `🎉 答對了！+${XP_PER_CORRECT} XP`;

        feedback.classList.add("good");
      } else {
        playSound('wrong');
        selectedButton.classList.add("wrong");

        feedback.textContent =
          `💡 再想一下，正確答案是 ${question.answer}`;

        feedback.classList.add("bad");
      }

      saveState();

      window.setTimeout(() => {
        questionIndex++;
        isAnswering = false;

        if (questionIndex < QUESTIONS_PER_ROUND) {
          renderQuestion();
        } else {
          finishRound();
        }
      }, 1500);
    }

    function finishRound() {
      state.progress[currentStage] = Math.min(
        5,
        state.progress[currentStage] + 1
      );

      state.best = Math.max(state.best, earnedXP);

      if (state.dailyDone !== getTodayKey()) {
        state.dailyDone = getTodayKey();
      }

      saveState();

      const isExcellent = earnedXP >= 80;
      const isLastStage = currentStage === stages.length - 1;

      $("resultEmoji").textContent =
        isExcellent ? "🏆" : "🌟";

      $("resultTitle").textContent =
        isExcellent ? "太厲害了！" : "完成一輪！";

      $("resultText").textContent = isExcellent
        ? "你對這個階段掌握得很好。"
        : "再玩幾輪，讓這個技能變得更穩！";

      $("earned").textContent = earnedXP;

      $("nextStageBtn").textContent =
        isLastStage ? "再次挑戰" : "下一關";

      show("result");
      speakText(`恭喜完成！獲得了 ${earnedXP} 點經驗值！`);
    }

    function nextStage() {
      const nextIndex = currentStage + 1;

      if (
        nextIndex < stages.length &&
        isStageUnlocked(nextIndex)
      ) {
        startStage(nextIndex);
      } else {
        startStage(currentStage);
      }
    }

    /*
      事件綁定
    */

    function bindBtn(id, action) {
      const el = $(id);
      if (el) {
        el.addEventListener("click", () => {
          playSound('click');
          action();
        });
      }
    }

    bindBtn("continueBtn", startRecommended);
    bindBtn("chooseStageBtn", () => show("stages"));
    bindBtn("backHomeBtn", () => show("home"));
    bindBtn("backStagesBtn", () => show("stages"));
    bindBtn("nextStageBtn", nextStage);
    bindBtn("resultStagesBtn", () => show("stages"));
    bindBtn("speakBtn", speakCurrentQuestion);

    /*
      初始化
    */

    updateHeader();
    renderStages();
  </script>
</body>
</html>
