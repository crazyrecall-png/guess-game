<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>小小商店｜販賣遊戲</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#fff7e8;color:#4b3a2a}
button,input{font:inherit}
button{cursor:pointer;border:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:center;gap:10px;padding:12px;background:#ffe0a8;box-shadow:0 3px 10px #0001}
.tab{padding:12px 24px;border-radius:18px;background:#fff;color:#805b35;font-weight:800;font-size:18px}
.tab.active{background:#ff9f68;color:#fff}
.page{display:none;max-width:1100px;margin:auto;padding:18px}
.page.active{display:block}
h1{text-align:center;margin:8px 0 18px;font-size:30px;color:#e87948}
.notice{background:#fff;border:3px solid #ffd18c;border-radius:18px;padding:12px;text-align:center;font-weight:700;margin-bottom:15px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:15px}
.product{background:#fff;border-radius:20px;padding:12px;text-align:center;box-shadow:0 4px 12px #8b5e2e18;border:2px solid #ffe0ad}
.product img{width:100px;height:100px;object-fit:contain;display:block;margin:0 auto 8px}
.empty-img{width:100px;height:100px;margin:auto;border-radius:15px;background:#f5eee4;display:flex;align-items:center;justify-content:center;color:#b5a18a;font-size:12px}
.control{display:flex;align-items:center;justify-content:center;gap:8px;margin:7px 0}
.control button{width:34px;height:34px;border-radius:12px;background:#ffd16e;color:#68491f;font-size:22px;font-weight:900}
.value{min-width:68px;width:100px;padding:8px;border-radius:10px;background:#fff4d7;border:2px solid #ffd18c;font-weight:900;text-align:center}
.price-input{width:82px;text-align:center;border:2px solid #ffd18c;border-radius:10px;padding:6px;background:#fffaf0}
.label{font-size:13px;color:#98795c}
.sell-count{margin-bottom:15px;text-align:center}
.big-btn{background:#ff9f68;color:#fff;padding:11px 22px;border-radius:15px;font-weight:900;font-size:17px}
.customer-products .product{transition:.15s;cursor:pointer}
.customer-products .product:active{transform:scale(.96)}
.cart{margin-top:20px;background:#fff;border:3px solid #ffd18c;border-radius:20px;padding:12px}
.cart-title{font-size:21px;font-weight:900;margin-bottom:10px}
.cart-row{display:flex;align-items:center;gap:12px;border-bottom:1px dashed #e8c99c;padding:8px 2px}
.cart-row:last-child{border-bottom:0}
.cart-row img{width:55px;height:55px;object-fit:contain}
.cart-info{flex:1}
.cart-price{font-weight:800}
.cart-qty{font-weight:900}
.cart-total{text-align:right;font-size:23px;font-weight:900;color:#e56d3b;padding-top:10px}
.cart-actions{text-align:right;margin-top:8px}
.secondary{background:#eadfce;color:#6d5840;padding:8px 14px;border-radius:12px;font-weight:800}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:50;padding:15px}
.modal.show{display:flex}
.modal-box{background:#fff9ed;border-radius:25px;padding:22px;max-width:430px;width:100%;text-align:center;box-shadow:0 10px 35px #0004}
.modal-box img{width:120px;height:120px;object-fit:contain}
.qty-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}
.qty-buttons button{padding:15px;border-radius:15px;background:#ffd16e;font-size:23px;font-weight:900}
.confirm{background:#ff9f68;color:#fff;padding:12px 25px;border-radius:14px;font-weight:900}
.cancel{background:#ddd0bd;color:#5f513f;padding:12px 18px;border-radius:14px;font-weight:900;margin-left:8px}
.calculator-wrap{max-width:460px;margin:auto}
.calc{background:#fff;border-radius:25px;padding:15px;box-shadow:0 5px 18px #8b5e2e20;border:3px solid #ffd18c}
.calc-display{background:#463a32;color:#fff;border-radius:15px;padding:15px;text-align:right;font-size:40px;min-height:75px;overflow:hidden}
.calc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.calc-grid button{height:62px;border-radius:15px;background:#fff0cf;font-size:25px;font-weight:900;color:#5c4631}
.calc-grid button.clear{background:#ffc0a4}
.check-area{background:#fff;margin-top:15px;border-radius:20px;padding:18px;text-align:center;border:3px solid #ffd18c;font-size:22px}.checkout-cart{margin-bottom:15px;text-align:left}.checkout-cart .cart-row img{width:75px;height:75px}.checkout-cart .cart-row{font-size:21px}.checkout-cart .cart-total{font-size:28px}
.money-box{font-size:24px;font-weight:900;margin:10px}
.money-box input{width:130px;padding:9px;border:2px solid #ffd18c;border-radius:12px;text-align:center}
.message{font-size:20px;font-weight:900;min-height:30px;margin-top:10px}
.hidden{display:none}
.settings{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.small{font-size:13px;color:#92765a}.unlock-label{background:#fff0cf;border-radius:14px;padding:10px 14px;font-weight:900;font-size:17px}.unlock-label input{width:22px;height:22px;vertical-align:middle}.calc-grid button.locked{opacity:.45;cursor:not-allowed}
@media(max-width:520px){
 .page{padding:12px}
 .tab{padding:10px 14px;font-size:16px}
 .products{grid-template-columns:repeat(2,1fr);gap:10px}
 .product{padding:9px}
 .calc-grid button{height:58px}
 h1{font-size:25px}
}
</style>
</head>
<body>
<div class="topbar">
  <button class="tab active" data-page="boss">🏪 老闆</button>
  <button class="tab" data-page="customer">🛒 客人</button>
  <button class="tab" data-page="checkout">💰 結帳</button>
</div>

<section id="boss" class="page active">
<h1>🏪 小小商店・老闆設定</h1>
<div class="notice">先選擇要販售的商品數量。圖片請放在 <b>sell_pic</b> 資料夾，檔名為 <b>item_1、item_2、item_3…</b></div>
<div class="sell-count control">
  <button id="removeProduct">−</button><input class="value" id="productCount" type="number" min="1" max="100" value="40" inputmode="numeric"><button id="addProduct">＋</button>
</div>
<div class="settings">
  <label class="unlock-label"><input type="radio" name="restockMode" value="manual"> 📦 每次都要補貨</label>
  <label class="unlock-label"><input type="radio" name="restockMode" value="auto" checked> ✨ 自動回補庫存</label>
</div>
<div class="settings">
  <button class="big-btn" id="saveSettings">💾 儲存商品設定</button>
  <button class="secondary" id="resetSettings">↺ 全部恢復預設</button>
</div>
<div id="bossProducts" class="products"></div>
</section>

<section id="customer" class="page">
<h1>🛒 小小商店・挑選商品</h1>
<div class="notice">點一下商品，再選擇購買數量！</div>
<div id="customerProducts" class="products customer-products"></div>
<div class="cart">
  <div class="cart-title">🛍️ 購物車</div>
  <div id="cartRows"></div>
  <div class="cart-total">總金額：<span id="cartTotal">0</span> 元</div>
  <div class="cart-actions">
    <button class="secondary" id="clearCart">清空購物車</button>
    <button class="big-btn" id="goCheckout">前往結帳 💰</button>
  </div>
</div>
</section>

<section id="checkout" class="page">
<h1>💰 小小收銀台</h1>
<div class="calculator-wrap">
  <div class="notice">先看下面的購物車，用計算機算出正確總金額，再確認！</div>
  <div class="cart checkout-cart"><div class="cart-title">🛍️ 本次購買商品</div><div id="checkoutCartRows"></div></div>
  <div class="calc">
    <div id="calcDisplay" class="calc-display">0</div>
    <div class="calc-grid">
      <button class="clear" data-key="C">C</button><button data-key="back">⌫</button><button data-key="=">=</button>
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button data-key="0">0</button><button data-key="+">＋</button><button data-key="-">－</button>
    </div>
  </div>
  <div class="check-area">
    <div class="settings"> <label class="unlock-label"><input type="checkbox" id="allowPlusMinus"> 🔓 啟用加減</label> <button class="big-btn" id="showRealTotal">👀 顯示正確總金額</button></div>
    <div id="realTotalArea" class="hidden">購物車真正總金額：<b id="realTotal">0</b> 元</div>
    <div class="money-box">小朋友算出的答案：
      <input id="answerInput" type="number" min="0" inputmode="numeric" placeholder="金額">
    </div>
    <button class="big-btn" id="checkAnswer">檢查答案</button>
    <div id="answerMessage" class="message"></div>
    <div id="customerPayArea" class="hidden">
      <hr>
      <div>客人給你多少錢？</div>
      <div class="money-box"><input id="paidInput" type="number" min="0" inputmode="numeric" placeholder="例如 100"></div>
      <button class="big-btn" id="checkPaid">檢查找零</button>
      <div id="changeMessage" class="message"></div>
    </div>
  </div>
</div>
</section>

<div id="qtyModal" class="modal">
 <div class="modal-box">
   <img id="modalImg" src="" alt="">
   <h2>要買幾個？</h2>
   <div class="qty-buttons">
     <button data-qty="1">1</button><button data-qty="2">2</button><button data-qty="3">3</button>
   </div>
   <button class="confirm" id="confirmQty">加入購物車 🛒</button>
   <button class="cancel" id="cancelQty">取消</button>
 </div>
</div>

<script>
const DEFAULT_COUNT=40;
let productCount=Number(localStorage.getItem("shop_product_count")||DEFAULT_COUNT);
let products=JSON.parse(localStorage.getItem("shop_products")||"null");
let cart=JSON.parse(localStorage.getItem("shop_cart")||"[]");
let selectedIndex=null, selectedQty=1;
let calc="";

function defaultProduct(i){return {price:10,stock:1};}
function ensureProducts(){
  if(!Array.isArray(products)) products=[];
  for(let i=products.length;i<productCount;i++) products.push(defaultProduct(i));
  products=products.slice(0,productCount);
}
ensureProducts();
const savedMode=localStorage.getItem("shop_restock_mode")||"auto";
const modeRadio=document.querySelector(`input[name="restockMode"][value="${savedMode}"]`); if(modeRadio) modeRadio.checked=true;

function imgPath(i){return `sell_pic/item_${i+1}.png`;}
function makeImg(i,cls=""){
  const img=document.createElement("img"); img.src=imgPath(i); img.className=cls; img.alt="";
  img.onerror=()=>{img.style.display="none"; img.insertAdjacentHTML("afterend",'<div class="empty-img">請放入<br>item_'+(i+1)+'.png</div>');};
  return img;
}
function save(){
 localStorage.setItem("shop_product_count",productCount);
 localStorage.setItem("shop_products",JSON.stringify(products));
 localStorage.setItem("shop_cart",JSON.stringify(cart));
}
function renderBoss(){
 document.getElementById("productCount").value=productCount;
 const box=document.getElementById("bossProducts"); box.innerHTML="";
 for(let i=0;i<productCount;i++){
  const p=products[i]||defaultProduct(i); products[i]=p;
  const card=document.createElement("div");card.className="product";
  card.appendChild(makeImg(i));
  card.insertAdjacentHTML("beforeend",`<div class="label">第 ${i+1} 個商品</div>
   <div class="label">商品價格</div>`);
  const pc=document.createElement("div");pc.className="control";
  pc.innerHTML=`<button>−</button><input class="price-input" type="number" min="0" step="5" value="${p.price}"><button>＋</button>`;
  pc.children[0].onclick=()=>{p.price=Math.max(0,p.price-5);pc.children[1].value=p.price;save();renderCustomer();};
  pc.children[2].onclick=()=>{p.price+=5;pc.children[1].value=p.price;save();renderCustomer();};
  pc.children[1].onchange=()=>{p.price=Math.max(0,Number(pc.children[1].value)||0);pc.children[1].value=p.price;save();renderCustomer();};
  card.appendChild(pc);
  card.insertAdjacentHTML("beforeend",`<div class="label">庫存數量</div>`);
  const sc=document.createElement("div");sc.className="control";
  sc.innerHTML=`<button>−</button><div class="value">${p.stock}</div><button>＋</button>`;
  sc.children[0].onclick=()=>{p.stock=Math.max(0,p.stock-1);save();renderBoss();renderCustomer();};
  sc.children[2].onclick=()=>{p.stock++;save();renderBoss();renderCustomer();};
  card.appendChild(sc); box.appendChild(card);
 }
}
function renderCustomer(){
 const box=document.getElementById("customerProducts");box.innerHTML="";
 for(let i=0;i<productCount;i++){
  const p=products[i];
  if(!p)continue;
  const card=document.createElement("div");card.className="product";
  card.appendChild(makeImg(i));
  card.insertAdjacentHTML("beforeend",`<div><b>${p.price} 元</b></div><div class="small">庫存：${p.stock}</div>`);
  card.onclick=()=>openQty(i);
  box.appendChild(card);
 }
 renderCart();
 const rows=document.getElementById("checkoutCartRows"); if(rows){rows.innerHTML=""; let total=0; cart.forEach(item=>{const p=products[item.index]; if(!p)return; total+=p.price*item.qty; const row=document.createElement("div");row.className="cart-row";row.appendChild(makeImg(item.index));row.insertAdjacentHTML("beforeend",`<div class="cart-info"><div><b>單價：${p.price} 元</b></div><div>數量：${item.qty}</div><div><b>小計：${p.price*item.qty} 元</b></div></div>`);rows.appendChild(row);});}
}
function renderCart(){
 const box=document.getElementById("cartRows");box.innerHTML="";
 let total=0;
 cart.forEach((item,idx)=>{
  const p=products[item.index]; if(!p)return;
  total+=p.price*item.qty;
  const row=document.createElement("div");row.className="cart-row";
  row.appendChild(makeImg(item.index));
  row.insertAdjacentHTML("beforeend",`<div class="cart-info"><div class="cart-price">${p.price} 元</div><div class="cart-qty">數量：${item.qty}</div></div>`);
  const del=document.createElement("button");del.className="secondary";del.textContent="刪除";
  del.onclick=()=>{p.stock+=item.qty;cart.splice(idx,1);save();renderBoss();renderCustomer();};
  row.appendChild(del);box.appendChild(row);
 });
 document.getElementById("cartTotal").textContent=total;
 document.getElementById("realTotal").textContent=total;
}
function openQty(i){
 if(products[i].stock<=0){cuteSound("bad");alert("這個商品賣完了喔！");return;}
 selectedIndex=i;selectedQty=1;
 document.getElementById("modalImg").src=imgPath(i);
 document.getElementById("qtyModal").classList.add("show");cuteSound("pop");
}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(b.dataset.page).classList.add("active");
 if(b.dataset.page==="checkout")resetCheckout();
 cuteSound("click");
});
document.getElementById("addProduct").onclick=()=>{if(productCount<100){productCount++;ensureProducts();save();renderBoss();renderCustomer();cuteSound("success");}};
document.getElementById("productCount").onchange=()=>{productCount=Math.min(100,Math.max(1,Number(document.getElementById("productCount").value)||1));ensureProducts();cart=cart.filter(x=>x.index<productCount);save();renderBoss();renderCustomer();cuteSound("click");};
document.getElementById("removeProduct").onclick=()=>{if(productCount>1){productCount--;ensureProducts();cart=cart.filter(x=>x.index<productCount);save();renderBoss();renderCustomer();cuteSound("click");}};
document.querySelectorAll('input[name="restockMode"]').forEach(r=>r.onchange=()=>{localStorage.setItem("shop_restock_mode",r.value);});
document.getElementById("saveSettings").onclick=()=>{localStorage.setItem("shop_restock_mode",getRestockMode());save();cuteSound("success");alert("商品設定已儲存！");};
document.getElementById("resetSettings").onclick=()=>{if(confirm("確定全部恢復預設？")){products=Array.from({length:productCount},(_,i)=>defaultProduct(i));cart=[];save();renderBoss();renderCustomer();cuteSound("success");}};
document.querySelectorAll(".qty-buttons button").forEach(b=>b.onclick=()=>{selectedQty=Number(b.dataset.qty);document.querySelectorAll(".qty-buttons button").forEach(x=>x.style.transform="");b.style.transform="scale(1.08)";cuteSound("click");});
document.getElementById("cancelQty").onclick=()=>document.getElementById("qtyModal").classList.remove("show");
document.getElementById("confirmQty").onclick=()=>{
 const p=products[selectedIndex];
 const already=cart.find(x=>x.index===selectedIndex);
 const current=already?already.qty:0;
 const can=Math.min(selectedQty,p.stock,current+selectedQty);
 if(selectedQty>p.stock){cuteSound("bad");alert("庫存不夠喔！");return;}
 p.stock-=selectedQty;
 if(already)already.qty+=selectedQty; else cart.push({index:selectedIndex,qty:selectedQty});
 save();document.getElementById("qtyModal").classList.remove("show");renderBoss();renderCustomer();cuteSound("success");
};
document.getElementById("clearCart").onclick=()=>{cart.forEach(x=>products[x.index].stock+=x.qty);cart=[];save();renderBoss();renderCustomer();cuteSound("click");};
document.getElementById("goCheckout").onclick=()=>{if(!cart.length){cuteSound("bad");alert("購物車還沒有商品喔！");return;}document.querySelector('[data-page="checkout"]').click();};

function resetCheckout(){
 calc="";document.getElementById("calcDisplay").textContent="0";
 document.getElementById("answerInput").value="";document.getElementById("paidInput").value="";
 document.getElementById("answerMessage").textContent="";document.getElementById("realTotalArea").classList.add("hidden");
 document.getElementById("changeMessage").textContent="";
 document.getElementById("customerPayArea").classList.add("hidden");
 renderCart();
 const rows=document.getElementById("checkoutCartRows"); if(rows){rows.innerHTML=""; let total=0; cart.forEach(item=>{const p=products[item.index]; if(!p)return; total+=p.price*item.qty; const row=document.createElement("div");row.className="cart-row";row.appendChild(makeImg(item.index));row.insertAdjacentHTML("beforeend",`<div class="cart-info"><div><b>單價：${p.price} 元</b></div><div>數量：${item.qty}</div><div><b>小計：${p.price*item.qty} 元</b></div></div>`);rows.appendChild(row);});}
}
const plusMinusAllowed=document.getElementById("allowPlusMinus");
const plusMinusButtons=[...document.querySelectorAll('.calc-grid button[data-key="+"] , .calc-grid button[data-key="-"]')];
function updateCalcLocks(){plusMinusButtons.forEach(b=>b.classList.toggle("locked",!plusMinusAllowed.checked));}
plusMinusAllowed.onchange=()=>{updateCalcLocks();cuteSound("click");}; updateCalcLocks();
document.querySelectorAll(".calc-grid button").forEach(b=>b.onclick=()=>{
 const k=b.dataset.key;
 if((k==="+"||k==="-")&&!plusMinusAllowed.checked){cuteSound("bad");return;}
 if(k==="C")calc="";
 else if(k==="back")calc=calc.slice(0,-1);
 else if(k==="="){
  if(!calc)return;
  try{calc=String(Math.max(0,Math.floor(Function("return "+calc.replace(/[^0-9+-]/g,""))())));}
  catch{calc="";}
  cuteSound("success");
 }else calc+=k;
 document.getElementById("calcDisplay").textContent=calc||"0";
 document.getElementById("answerInput").value=calc.replace(/[^0-9]/g,"");
});
document.getElementById("showRealTotal").onclick=()=>{document.getElementById("realTotalArea").classList.remove("hidden");cuteSound("pop");};
document.getElementById("checkAnswer").onclick=()=>{
 const real=Number(document.getElementById("realTotal").textContent);
 const ans=Number(document.getElementById("answerInput").value);
 const m=document.getElementById("answerMessage");
 if(ans===real){m.textContent="🎉 答對了！現在來算找零！";m.style.color="#36a269";document.getElementById("customerPayArea").classList.remove("hidden");cuteSound("success");}
 else{m.textContent="🤔 再算一次看看！";m.style.color="#df6b45";cuteSound("bad");}
};
document.getElementById("checkPaid").onclick=()=>{
 const real=Number(document.getElementById("realTotal").textContent),paid=Number(document.getElementById("paidInput").value);
 const m=document.getElementById("changeMessage");
 if(paid<real){m.textContent="💡 客人的錢還不夠喔！";m.style.color="#df6b45";cuteSound("bad");return;}
 const change=paid-real;
 const userChange=prompt(`客人應該找多少錢？（答案：${change} 元）\n請輸入小朋友算出的找零：`);
 if(Number(userChange)===change){m.textContent=`🌟 太棒了！正確！應找 ${change} 元`;m.style.color="#36a269";cuteSound("success"); setTimeout(finishSale,700);}
 else{m.textContent="😊 再想一下找零是多少？";m.style.color="#df6b45";cuteSound("bad");}
};

function getRestockMode(){ return document.querySelector('input[name="restockMode"]:checked')?.value || localStorage.getItem("shop_restock_mode") || "auto"; }
function finishSale(){
  cart=[];
  if(getRestockMode()==="auto") products.forEach(p=>p.stock=1);
  save();
  resetCheckout();
  renderBoss(); renderCustomer();
  document.querySelector('[data-page="customer"]').click();
  alert(getRestockMode()==="auto" ? "🎉 結帳完成！商品已自動回補，可以開始下一位客人囉！" : "🎉 結帳完成！本次商品已售出，請老闆重新補貨！");
}
let audioCtx;
function cuteSound(type){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const now=audioCtx.currentTime;
  const notes=type==="success"?[523.25,659.25,783.99]:type==="bad"?[220,180]:type==="pop"?[660,880]:[440,660];
  notes.forEach((f,i)=>{
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.09);g.gain.exponentialRampToValueAtTime(.12,now+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.09+.16);
   o.connect(g);g.connect(audioCtx.destination);o.start(now+i*.09);o.stop(now+i*.09+.18);
  });
 }catch(e){}
}
