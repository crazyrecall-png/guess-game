<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>小朋友俄羅斯方塊 🧩 長條＋方形</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Fredoka', 'Chalkboard SE', 'Comic Sans MS', sans-serif;
        }

        body {
            background-color: #fce4ec;
            background-image: radial-gradient(#f8bbd0 10%, transparent 11%);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            color: #4a4a4a;
        }

        .game-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(240, 98, 146, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 520px;
            width: 100%;
            border: 4px solid #f48fb1;
            position: relative;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            color: #ec407a;
            font-size: 26px;
            text-shadow: 2px 2px 0px #f8bbd0;
        }

        .sound-btn {
            background: #f8bbd0;
            border: 2px solid #f48fb1;
            border-radius: 12px;
            color: #880e4f;
            font-weight: bold;
            font-size: 13px;
            padding: 4px 10px;
            cursor: pointer;
            box-shadow: 0 2px 0 #f48fb1;
        }

        .sound-btn:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        .main-layout {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
        }

        .canvas-wrapper {
            position: relative;
        }

        #tetris {
            border: 4px solid #f8bbd0;
            border-radius: 16px;
            background-color: #fffafc;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            display: block;
        }

        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 240, 245, 0.9);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #ec407a;
            text-shadow: 1px 1px 0 #ffffff;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .pause-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 140px;
        }

        .card {
            background: #f8bbd0;
            border-radius: 16px;
            padding: 8px 10px;
            text-align: center;
            box-shadow: 0 4px 0 #f48fb1;
            color: #880e4f;
        }

        .card label {
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }

        .card .value {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 1px 1px 0 #c2185b;
        }

        #next-canvas {
            background: #fffafc;
            border-radius: 12px;
            border: 2px solid #f48fb1;
            margin-top: 4px;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 4px 0 0 0;
            text-align: left;
            font-size: 12px;
            color: #ffffff;
            font-weight: bold;
        }

        .leaderboard-list li {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.25);
            padding: 2px 6px;
            border-radius: 6px;
            margin-bottom: 3px;
            text-shadow: 1px 1px 0 #c2185b;
        }

        .controls {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        .btn {
            background: #ffb74d;
            border: none;
            border-bottom: 4px solid #f57c00;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 0;
            flex: 1;
            max-width: 90px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.05s, background-color 0.1s;
            touch-action: manipulation;
        }

        .btn:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
            box-shadow: none;
        }

        .btn-rotate { background: #ba68c8; border-color: #7b1fa2; }
        .btn-pause { background: #ff7043; border-color: #d84315; }
        .btn-drop { background: #4dd0e1; border-color: #0097a7; flex: 2; max-width: 190px; }

        #combo-msg {
            height: 24px;
            font-weight: bold;
            color: #ff4081;
            font-size: 16px;
            margin-bottom: 4px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header-bar">
        <h1>🧩 小朋友方塊遊戲</h1>
        <button class="sound-btn" id="btn-sound">🔊 音效: 開</button>
    </div>

    <div id="combo-msg"></div>

    <div class="main-layout">
        <div class="canvas-wrapper">
            <canvas id="tetris" width="240" height="480"></canvas>
            <div class="pause-overlay" id="pause-overlay">⏸️ 遊戲暫停中</div>
        </div>

        <div class="info-panel">
            <div class="card">
                <label>下一個</label>
                <canvas id="next-canvas" width="80" height="80"></canvas>
            </div>
            <div class="card">
                <label>目前分數</label>
                <div class="value" id="score">0</div>
            </div>
            <div class="card">
                <label>目前難度</label>
                <div class="value" id="level">Lv. 1</div>
            </div>
            <div class="card">
                <label>🏆 前5名排行榜</label>
                <ol class="leaderboard-list" id="leaderboard">
                    <li><span>1. ---</span><span>0</span></li>
                    <li><span>2. ---</span><span>0</span></li>
                    <li><span>3. ---</span><span>0</span></li>
                    <li><span>4. ---</span><span>0</span></li>
                    <li><span>5. ---</span><span>0</span></li>
                </ol>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="btn-row">
            <button class="btn btn-rotate" id="btn-up">↻ 旋轉</button>
            <button class="btn btn-pause" id="btn-pause">⏸️ 暫停</button>
        </div>
        <div class="btn-row">
            <button class="btn" id="btn-left">←</button>
            <button class="btn" id="btn-down">↓ 加速</button>
            <button class="btn" id="btn-right">→</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-drop" id="btn-space">⚡ 直接到底 ⚡</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextContext = nextCanvas.getContext('2d');
    const pauseOverlay = document.getElementById('pause-overlay');

    const BLOCK_SIZE = 24; 
    context.scale(BLOCK_SIZE, BLOCK_SIZE);
    nextContext.scale(20, 20); 

    const COLORS = [
        null,
        '#ff80ab',
        '#ffd54f',
        '#b388ff',
        '#81c784',
        '#ff8a65',
        '#4fc3f7',
        '#a1887f'
    ];

    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    document.getElementById('btn-sound').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        document.getElementById('btn-sound').innerText = soundEnabled ? '🔊 音效: 開' : '🔇 音效: 關';
    });

    function playTone(freq, type, duration, startVol = 0.1, endVol = 0.01) {
        if (!soundEnabled) return;
        initAudio();
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(startVol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(endVol, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    const SFX = {
        rotate() {
            playTone(1046.5, 'sine', 0.08, 0.15, 0.01);
        },
        move() {
            playTone(400, 'triangle', 0.04, 0.08, 0.01);
        },
        drop() {
            playTone(261.6, 'triangle', 0.1, 0.15, 0.01);
        },
        hardDrop() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        },
        clearLine(rowCount) {
            if (!soundEnabled) return;
            const notes = rowCount >= 4 ? [523.25, 659.25, 783.99, 1046.5] : [523.25, 659.25, 783.99];
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    playTone(freq, 'sine', 0.15, 0.2, 0.01);
                }, idx * 70);
            });
        },
        gameOver() {
            if (!soundEnabled) return;
            const notes = [400, 350, 300, 250];
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    playTone(freq, 'sawtooth', 0.2, 0.15, 0.01);
                }, idx * 120);
            });
        }
    };

    function createPiece(type) {
        if (type === 'I') {
            return [
                [0, 1, 0, 0],
                [0, 1, 0, 0],
                [0, 1, 0, 0],
                [0, 1, 0, 0],
            ];
        } else if (type === 'O') {
            return [
                [2, 2],
                [2, 2],
            ];
        } else if (type === 'T') {
            return [
                [0, 3, 0],
                [3, 3, 3],
                [0, 0, 0],
            ];
        } else if (type === 'S') {
            return [
                [0, 4, 4],
                [4, 4, 0],
                [0, 0, 0],
            ];
        } else if (type === 'Z') {
            return [
                [5, 5, 0],
                [0, 5, 5],
                [0, 0, 0],
            ];
        } else if (type === 'J') {
            return [
                [0, 6, 0],
                [0, 6, 0],
                [6, 6, 0],
            ];
        } else if (type === 'L') {
            return [
                [0, 7, 0],
                [0, 7, 0],
                [0, 7, 7],
            ];
        }
    }

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) {
            matrix.push(new Array(w).fill(0));
        }
        return matrix;
    }

    const arena = createMatrix(10, 20);

    const player = {
        pos: {x: 0, y: 0},
        matrix: null,
        nextMatrix: null,
        score: 0,
        level: 1,
    };

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let isPaused = false;

    const pieces = 'IO';
    function getRandomPiece() {
        return createPiece(pieces[pieces.length * Math.random() | 0]);
    }

    function drawGrid(ctx, width, height) {
        ctx.strokeStyle = '#f8bbd0';
        ctx.lineWidth = 0.03;

        for (let x = 0; x <= width; x++) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
        }

        for (let y = 0; y <= height; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }
    }

    function drawRoundedRect(ctx, x, y, width, height, radius, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x + 0.05, y + 0.05, width - 0.1, height - 0.1, radius);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 0.1;
        ctx.stroke();
    }

    function drawMatrix(matrix, offset, ctx = context) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    drawRoundedRect(ctx, x + offset.x, y + offset.y, 1, 1, 0.2, COLORS[value]);
                }
            });
        });
    }

    function draw() {
        context.fillStyle = '#fffafc';
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawGrid(context, 10, 20);

        drawMatrix(arena, {x: 0, y: 0});
        drawMatrix(player.matrix, player.pos);

        nextContext.fillStyle = '#fffafc';
        nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        drawGrid(nextContext, 4, 4);

        if (player.nextMatrix) {
            const offsetX = (4 - player.nextMatrix[0].length) / 2;
            const offsetY = (4 - player.nextMatrix.length) / 2;
            drawMatrix(player.nextMatrix, {x: offsetX, y: offsetY}, nextContext);
        }
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 &&
                   (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    function arenaSweep() {
        let rowCount = 0;
        outer: for (let y = arena.length - 1; y >= 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) {
                    continue outer;
                }
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            rowCount++;
        }

        if (rowCount > 0) {
            const baseScores = [0, 100, 300, 600, 1000];
            const addedScore = baseScores[rowCount] || rowCount * 250;
            player.score += addedScore;

            SFX.clearLine(rowCount);

            showComboMsg(rowCount);

            player.level = Math.floor(player.score / 500) + 1;
            dropInterval = Math.max(150, 1000 - (player.level - 1) * 100);

            updateScoreUI();
        }
    }

    function showComboMsg(count) {
        const msgEl = document.getElementById('combo-msg');
        const msgs = ['', '不錯喔！ +100', '太棒了！ +300', '超級厲害！ +600', '🎉 完美清空 Tetris! +1000'];
        msgEl.innerText = msgs[count] || `一次消除 ${count} 行！`;
        setTimeout(() => {
            msgEl.innerText = '';
        }, 1500);
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) {
            matrix.forEach(row => row.reverse());
        } else {
            matrix.reverse();
        }
    }

    function playerRotate(dir) {
        if (isPaused) return;
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
        SFX.rotate();
    }

    function playerMove(dir) {
        if (isPaused) return;
        player.pos.x += dir;
        if (collide(arena, player)) {
            player.pos.x -= dir;
        } else {
            SFX.move();
        }
    }

    function playerDrop(isManual = false) {
        if (isPaused) return;
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            SFX.drop();
            playerReset();
            arenaSweep();
        } else if (isManual) {
            SFX.move();
        }
        dropCounter = 0;
    }

    function playerHardDrop() {
        if (isPaused) return;
        while (!collide(arena, player)) {
            player.pos.y++;
        }
        player.pos.y--;
        merge(arena, player);
        SFX.hardDrop();
        playerReset();
        arenaSweep();
        dropCounter = 0;
    }

    function togglePause() {
        isPaused = !isPaused;
        const btnPause = document.getElementById('btn-pause');
        if (isPaused) {
            pauseOverlay.classList.add('active');
            btnPause.innerText = '▶️ 繼續';
        } else {
            pauseOverlay.classList.remove('active');
            btnPause.innerText = '⏸️ 暫停';
        }
    }

    function playerReset() {
        if (!player.nextMatrix) {
            player.nextMatrix = getRandomPiece();
        }
        player.matrix = player.nextMatrix;
        player.nextMatrix = getRandomPiece();
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

        if (collide(arena, player)) {
            SFX.gameOver();
            checkLeaderboard(player.score);
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.level = 1;
            dropInterval = 1000;
            updateScoreUI();
        }
    }

    function updateScoreUI() {
        document.getElementById('score').innerText = player.score;
        document.getElementById('level').innerText = `Lv. ${player.level}`;
    }

    function getLeaderboard() {
        const data = localStorage.getItem('tetris_kids_leaderboard');
        return data ? JSON.parse(data) : [];
    }

    function saveLeaderboard(board) {
        localStorage.setItem('tetris_kids_leaderboard', JSON.stringify(board));
    }

    function renderLeaderboard() {
        const board = getLeaderboard();
        const listEl = document.getElementById('leaderboard');
        listEl.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            const item = board[i] || { name: '---', score: 0 };
            const li = document.createElement('li');
            li.innerHTML = `<span>${i + 1}. ${item.name}</span><span>${item.score}</span>`;
            listEl.appendChild(li);
        }
    }

    function checkLeaderboard(finalScore) {
        const board = getLeaderboard();
        const minScore = board.length < 5 ? 0 : board[board.length - 1].score;

        if (finalScore > 0 && (board.length < 5 || finalScore > minScore)) {
            setTimeout(() => {
                const name = prompt(`🎉 恭喜進入前 5 名！\n你的得分是：${finalScore}\n請輸入你的名字：`, '玩家') || '匿名玩家';
                board.push({ name: name.substring(0, 8), score: finalScore });
                board.sort((a, b) => b.score - a.score);
                if (board.length > 5) board.pop();
                saveLeaderboard(board);
                renderLeaderboard();
            }, 50);
        } else {
            setTimeout(() => {
                alert(`遊戲結束！\n您的最終得分是：${finalScore}`);
            }, 50);
        }
    }

    function update(time = 0) {
        const deltaTime = time - lastTime;
        lastTime = time;

        if (!isPaused) {
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }
        }

        draw();
        requestAnimationFrame(update);
    }

    document.addEventListener('keydown', event => {
        initAudio();

        if (event.keyCode === 80 || event.keyCode === 27) {
            togglePause();
            return;
        }

        if (isPaused) return;

        if (event.keyCode === 37) {
            playerMove(-1);
        } else if (event.keyCode === 39) {
            playerMove(1);
        } else if (event.keyCode === 40) {
            playerDrop(true);
        } else if (event.keyCode === 38) {
            playerRotate(1);
        } else if (event.keyCode === 32) {
            event.preventDefault();
            playerHardDrop();
        }
    });

    function bindBtn(id, action) {
        const btn = document.getElementById(id);
        const handleEvent = (e) => {
            e.preventDefault();
            initAudio();
            action();
        };
        btn.addEventListener('touchstart', handleEvent, { passive: false });
        btn.addEventListener('click', handleEvent);
    }

    bindBtn('btn-up', () => playerRotate(1));
    bindBtn('btn-left', () => playerMove(-1));
    bindBtn('btn-right', () => playerMove(1));
    bindBtn('btn-down', () => playerDrop(true));
    bindBtn('btn-space', () => playerHardDrop());
    bindBtn('btn-pause', () => togglePause());

    renderLeaderboard();
    playerReset();
    updateScoreUI();
    update();
</script>

</body>
</html>
