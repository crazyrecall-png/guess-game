<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>可愛大富翁 v1.0.8 (兒童大按鈕版)</title>
  <style>
    :root {
      --bg-color: #fef6e4;
      --board-bg: #ffffff;
      --cell-bg: #ffeaa7;
      --cell-border: #fdcb6e;
      --cell-text: #d63031;
      
      --active-bg: #ff7675;
      --active-text: #ffffff;
      --active-shadow: 0 0 15px #ff7675;

      --primary: #ff7675;
      --secondary: #74b9ff;
      --accent: #fd79a8;
      --text: #2d3436;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', 'Comic Sans MS', "Chalkboard SE", "Yu Gothic", sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 4px;
      overflow: hidden;
    }

    /* 網格布局：外圍格子壓縮至 42~55px，中間 2 欄 4 列無限放大 */
    .game-container {
      width: 100%;
      max-width: 520px;
      height: calc(100vh - 8px);
      max-height: 860px;
      background: var(--board-bg);
      border: 4px solid #fab1a0;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      display: grid;
      /* 欄位：[外圍小格] [中間大區] [中間大區] [外圍小格] */
      grid-template-columns: clamp(42px, 12vw, 55px) 1fr 1fr clamp(42px, 12vw, 55px);
      /* 列位：[外圍小格] [中間大區 1..4] [外圍小格] */
      grid-template-rows: clamp(42px, 10vh, 55px) repeat(4, 1fr) clamp(42px, 10vh, 55px);
      gap: 3px;
      padding: 3px;
      position: relative;
    }

    /* 外圍小格子樣式 */
    .cell {
      background-color: var(--cell-bg);
      border: 2px solid var(--cell-border);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--cell-text);
      text-align: center;
      position: relative;
      transition: all 0.15s ease-in-out;
    }

    .cell.start-cell {
      background-color: #ffabe7;
      border-color: #fd79a8;
      color: #000;
      font-size: 14px;
      line-height: 1.1;
    }

    .cell.active {
      background-color: var(--active-bg) !important;
      color: var(--active-text) !important;
      border-color: var(--active-bg);
      box-shadow: var(--active-shadow);
      font-size: 24px;
      transform: scale(1.08);
      z-index: 5;
    }

    /* 巨型中間控制面板 */
    .center-dashboard {
      grid-column: 2 / 4;
      grid-row: 2 / 6;
      background: #f1f2f6;
      border-radius: 16px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
      border: 3px dashed #dfe6e9;
      z-index: 1;
      gap: 6px;
    }

    .dashboard-title {
      font-size: 18px;
      color: #d63031;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .version-tag {
      font-size: 12px;
      color: #636e72;
      font-weight: normal;
    }

    .section-box {
      width: 100%;
      background: #ffffff;
      padding: 8px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
      text-align: center;
    }

    .section-box-large {
      border: 3px solid #74b9ff;
    }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #636e72;
      margin-bottom: 4px;
    }

    .section-title-large {
      font-size: 15px !important;
      font-weight: 900 !important;
      color: #2d3436 !important;
      margin-bottom: 6px !important;
    }

    .input-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    /* 超大數字輸入框 */
    input[type="number"] {
      width: 60px;
      height: 44px;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      border: 3px solid #74b9ff;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }

    .input-large {
      width: 75px !important;
      height: 52px !important;
      font-size: 28px !important;
      border-width: 3px !important;
      border-color: #ff7675 !important;
    }

    /* 超大按鈕（兒童友善） */
    .btn {
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      background-color: var(--secondary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 0 #0984e3;
    }

    .btn:active {
      box-shadow: 0 1px 0 #0984e3;
      transform: translateY(3px);
    }

    .btn-big {
      font-size: 18px !important;
      padding: 8px 16px !important;
      border-radius: 12px !important;
      font-weight: 900 !important;
      min-height: 48px;
    }

    .btn-adjust {
      width: 44px;
      height: 44px;
      font-size: 24px;
      font-weight: 900;
      border-radius: 10px;
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-adjust-large {
      width: 52px !important;
      height: 52px !important;
      font-size: 30px !important;
      border-radius: 12px !important;
    }

    .btn-minus {
      background-color: #ff7675;
      box-shadow: 0 4px 0 #d63031;
    }
    .btn-minus:active {
      box-shadow: 0 1px 0 #d63031;
      transform: translateY(3px);
    }

    .btn-plus {
      background-color: #2ed573;
      box-shadow: 0 4px 0 #26af5f;
    }
    .btn-plus:active {
      box-shadow: 0 1px 0 #26af5f;
      transform: translateY(3px);
    }

    /* 獨立雙骰區放大 */
    .dual-dice-group {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .dice-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .dice-label {
      font-size: 14px;
      font-weight: 900;
      color: #2d3436;
    }

    .dice-box {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
      border: 3px solid #e17055;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: 900;
      color: #d63031;
      cursor: pointer;
      box-shadow: 0 4px 0 #d63031;
    }

    .dice-box.rolling {
      animation: diceRoll 0.8s ease-in-out infinite;
    }

    @keyframes diceRoll {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-25deg) scale(1.15); }
      50% { transform: rotate(25deg) scale(0.9); }
      75% { transform: rotate(-15deg) scale(1.1); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .money-total-box {
      background: #f8efba;
      border: 2px dashed #e1b12c;
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .money-title {
      font-size: 15px;
      font-weight: 900;
      color: #222f3e;
    }

    .money-val {
      font-size: 22px;
      font-weight: 900;
      color: #10ac84;
    }

    .stat-display {
      font-size: 22px;
      font-weight: 900;
      color: #2d3436;
      min-width: 36px;
    }

    /* Modal 彈窗樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-content {
      background: white;
      padding: 24px 18px;
      border-radius: 20px;
      text-align: center;
      max-width: 340px;
      width: 88%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      border: 5px solid var(--accent);
      transform: scale(0.8);
      transition: transform 0.2s;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-title {
      font-size: 24px;
      color: #ff7675;
      margin-bottom: 12px;
      font-weight: 900;
    }

    .modal-desc {
      font-size: 20px;
      color: #2d3436;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .modal-btn {
      font-size: 18px;
      padding: 10px 28px;
      margin-top: 10px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="game-container" id="board">
    <!-- 巨型中間控制面板 -->
    <div class="center-dashboard">
      <div class="dashboard-title">
        🎲 歡樂大富翁 <span class="version-tag">v1.0.8</span>
      </div>

      <!-- 🎲 1. 金額抽獎獨立雙骰區 -->
      <div class="section-box section-box-large">
        <div class="section-title section-title-large">🎲 獨立雙骰區 (金額/抽獎)</div>
        
        <div class="dual-dice-group">
          <div class="dice-item">
            <span class="dice-label">💰 金額骰</span>
            <div class="dice-box" id="moneyDiceBox" onclick="rollSingleDice('money')">1</div>
            <button class="btn btn-big" style="background-color: #10ac84; box-shadow: 0 4px 0 #0abde3;" onclick="rollSingleDice('money')">擲金額</button>
          </div>

          <div class="dice-item">
            <span class="dice-label">🎯 點數骰</span>
            <div class="dice-box" id="stepDiceBox" onclick="rollSingleDice('step')">1</div>
            <button class="btn btn-big" style="background-color: #ff9f43; box-shadow: 0 4px 0 #ee5253;" onclick="rollSingleDice('step')">抽獎</button>
          </div>
        </div>

        <div class="money-total-box">
          <div class="money-title">總金額：</div>
          <div class="money-val" id="totalMoneyDisplay">$0</div>
          <div class="input-group">
            <button class="btn-adjust btn-minus" style="width:36px; height:36px; font-size:20px;" onclick="customAdjustMoney(-1)">-</button>
            <button class="btn-adjust btn-plus" style="width:36px; height:36px; font-size:20px;" onclick="customAdjustMoney(1)">+</button>
          </div>
        </div>
      </div>

      <!-- 🎯 2. 超大移動步數控制區 -->
      <div class="section-box section-box-large" style="border-color: #ff7675;">
        <div class="section-title section-title-large">🚶‍♂️ 移動步數 (不可為 0)</div>
        <div class="input-group">
          <button class="btn-adjust btn-adjust-large btn-minus" onclick="changeStep(-1)">-</button>
          <input type="number" id="stepInput" class="input-large" value="1">
          <button class="btn-adjust btn-adjust-large btn-plus" onclick="changeStep(1)">+</button>
          <button class="btn btn-big" style="margin-left: 4px; background-color: #ff7675; box-shadow: 0 4px 0 #d63031;" onclick="handleManualMove()">移動</button>
        </div>
      </div>

      <!-- 🎁 3. 獎品數量統計 -->
      <div class="section-box">
        <div class="section-title">🎁 目前獎品數 (最少1)</div>
        <div class="input-group">
          <button class="btn-adjust btn-minus" onclick="changePrize(-1)">-</button>
          <span class="stat-display" id="prizeDisplay">1</span>
          <button class="btn-adjust btn-plus" onclick="changePrize(1)">+</button>
        </div>
      </div>

      <!-- 🏁 4. 目標與已完成圈數 -->
      <div class="section-box">
        <div class="section-title">🏁 目標圈數 / 已完成圈數</div>
        <div class="input-group">
          <button class="btn-adjust btn-minus" onclick="changeTargetLaps(-1)">-</button>
          <input type="number" id="targetLapInput" value="1" min="1">
          <button class="btn-adjust btn-plus" onclick="changeTargetLaps(1)">+</button>
        </div>
        <div style="font-size: 13px; font-weight: 900; color: #0984e3; margin-top: 4px;">
          已完成 <span id="completedLapDisplay">0</span> / <span id="targetLapDisplay">1</span> 圈
        </div>
      </div>

      <button class="btn btn-big" style="background-color: #a55eea; box-shadow: 0 4px 0 #8854d0; width: 100%; min-height:44px; font-size:16px !important;" onclick="resetGame()">🔄 再開一局 (保留金額)</button>
    </div>
  </div>

  <!-- Modal 彈窗區域 -->
  <div class="modal-overlay" id="moneyModal">
    <div class="modal-content" style="border-color: #fdcb6e;">
      <div class="modal-title" id="moneyModalTitle" style="color: #e17055;">💰 調整金額</div>
      <div style="font-size: 15px; color: #636e72; margin-bottom: 12px; font-weight:bold;">請點擊按鈕或輸入金額：</div>
      <div class="input-group" style="margin-bottom: 14px;">
        <button class="btn-adjust btn-minus" style="width:48px; height:48px; font-size:24px;" onclick="changeModalMoneyInput(-100)">-</button>
        <input type="number" id="moneyModalInput" value="500" style="width: 110px; height: 48px; font-size: 24px;">
        <button class="btn-adjust btn-plus" style="width:48px; height:48px; font-size:24px;" onclick="changeModalMoneyInput(100)">+</button>
      </div>
      <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 16px;">
        <button class="btn" style="background-color: #ff7675; box-shadow: 0 4px 0 #d63031; padding: 8px 14px; font-size:16px;" onclick="changeModalMoneyInput(-500)">-500</button>
        <button class="btn" style="background-color: #2ed573; box-shadow: 0 4px 0 #26af5f; padding: 8px 14px; font-size:16px;" onclick="changeModalMoneyInput(500)">+500</button>
      </div>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button class="btn modal-btn" style="background-color: #2ed573; box-shadow: 0 4px 0 #26af5f;" onclick="confirmCustomMoney()">確定</button>
        <button class="btn modal-btn" style="background-color: #ff7675; box-shadow: 0 4px 0 #d63031;" onclick="closeModal('moneyModal')">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="diceModal">
    <div class="modal-content" style="border-color: #74b9ff;">
      <div class="modal-title" id="diceModalTitle" style="color: #0984e3;">🎲 骰子結果</div>
      <div class="modal-desc" id="diceModalPoint">骰出點數：0 點</div>
      <div class="modal-desc" style="color: #00b894; font-size: 22px;" id="diceModalMoney">獎品號碼：0 號</div>
      <button class="btn modal-btn" onclick="closeModal('diceModal')">確定</button>
    </div>
  </div>

  <div class="modal-overlay" id="surpriseModal">
    <div class="modal-content">
      <div class="modal-title">✨ 踩中驚喜！</div>
      <div class="modal-desc" id="surpriseResultText">抽到什麼呢？</div>
      <button class="btn modal-btn" onclick="closeModal('surpriseModal')">確定</button>
    </div>
  </div>

  <div class="modal-overlay" id="winModal">
    <div class="modal-content" style="border-color: #ff7675;">
      <div class="modal-title">🏆 恭喜獲勝！</div>
      <div class="modal-desc">你已經跑滿設定的圈數囉！</div>
      <button class="btn modal-btn" style="background-color: #00b894; box-shadow: 0 4px 0 #008f68;" onclick="resetGame()">再玩一次 (保留金額)</button>
    </div>
  </div>

  <script>
    // 防止連點縮放
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    // 音效控制
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playClickSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playStepSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(350, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playSurpriseSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(523.25, now);
      gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.15);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(659.25, now + 0.15);
      gain2.gain.setValueAtTime(0.4, now + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.15);
      osc2.stop(now + 0.45);
    }

    function playWinSound() {
      initAudio();
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const startTime = audioCtx.currentTime + idx * 0.12;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.3);
      });
    }

    // --- 設定：上下 4 格、左右 6 格（4 欄 x 6 列，共 16 格） ---
    const COLS = 4;
    const ROWS = 6;
    
    const pathCoords = [];
    for (let c = 1; c <= COLS; c++) pathCoords.push({ r: 1, c: c });
    for (let r = 2; r <= ROWS; r++) pathCoords.push({ r: r, c: COLS });
    for (let c = COLS - 1; c >= 1; c--) pathCoords.push({ r: ROWS, c: c });
    for (let r = ROWS - 1; r >= 2; r--) pathCoords.push({ r: r, c: 1 });

    const totalCells = pathCoords.length; // 16格
    let currentPosition = 0;
    let totalStepsTaken = 0;
    let prizeCount = 1;
    let completedLaps = 0;
    let targetLaps = 1;
    let totalMoney = 0;
    let isMoving = false;
    let isRolling = false;
    let currentMoneyDir = 1;

    const surprises = [
      { name: "再來１次", weight: 10, action: () => handleExtraTurn() },
      { name: "抽１顆", weight: 30, action: () => changePrize(1) },
      { name: "扣１顆", weight: 30, action: () => changePrize(-1) },
      { name: "再前進１步", weight: 50, action: () => autoStep(1) },
      { name: "再前進２步", weight: 30, action: () => autoStep(2) },
      { name: "再前進３步", weight: 10, action: () => autoStep(3) },
      { name: "往退後１步", weight: 40, action: () => autoStep(-1) },
      { name: "往退後２步", weight: 20, action: () => autoStep(-2) },
      { name: "往退後３步", weight: 5, action: () => autoStep(-3) }
    ];

    const cellElements = [];
    const board = document.getElementById('board');

    pathCoords.forEach((coord, idx) => {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.id = `cell-${idx}`;
      cell.style.gridRow = coord.r;
      cell.style.gridColumn = coord.c;

      if (idx === 0) {
        cell.classList.add('start-cell');
        cell.innerHTML = '起點<br>0';
      } else {
        cell.innerText = idx;
      }
      board.appendChild(cell);
      cellElements.push(cell);
    });

    updatePlayerPositionUI();

    function rollSingleDice(type) {
      if (isRolling || isMoving) return;
      isRolling = true;
      playClickSound();

      const maxVal = (type === 'money') ? 5 : 18;
      const targetBox = document.getElementById(type === 'money' ? 'moneyDiceBox' : 'stepDiceBox');
      targetBox.classList.add('rolling');

      const rollInterval = setInterval(() => {
        targetBox.innerText = Math.floor(Math.random() * maxVal) + 1;
        playStepSound();
      }, 60);

      setTimeout(() => {
        clearInterval(rollInterval);
        const finalValue = Math.floor(Math.random() * maxVal) + 1;
        targetBox.innerText = finalValue;
        targetBox.classList.remove('rolling');
        isRolling = false;

        playSurpriseSound();

        if (type === 'money') {
          const earned = finalValue * 100;
          totalMoney += earned;
          document.getElementById('totalMoneyDisplay').innerText = `$${totalMoney}`;
          
          document.getElementById('diceModalTitle').innerText = '💰 金額骰結果';
          document.getElementById('diceModalPoint').innerText = `骰出點數：${finalValue} 點`;
          document.getElementById('diceModalMoney').innerText = `獲得金額：${earned} 元`;
        } else {
          document.getElementById('diceModalTitle').innerText = '🎁 抽獎結果';
          document.getElementById('diceModalPoint').innerText = `骰出點數：${finalValue} 點`;
          document.getElementById('diceModalMoney').innerText = `獎品號碼：${finalValue} 號`;
        }

        openModal('diceModal');
      }, 800);
    }

    function customAdjustMoney(direction) {
      playClickSound();
      currentMoneyDir = direction;
      const titleText = direction > 0 ? "💰 增加金額 (+)" : "💰 扣除金額 (-)";
      document.getElementById('moneyModalTitle').innerText = titleText;
      document.getElementById('moneyModalInput').value = 500;
      openModal('moneyModal');
    }

    function changeModalMoneyInput(delta) {
      playClickSound();
      const input = document.getElementById('moneyModalInput');
      let val = parseInt(input.value, 10) || 0;
      val = Math.max(0, val + delta);
      input.value = val;
    }

    function confirmCustomMoney() {
      playClickSound();
      const input = document.getElementById('moneyModalInput');
      let amount = parseInt(input.value, 10);
      if (isNaN(amount) || amount < 0) amount = 0;

      totalMoney += amount * currentMoneyDir;
      document.getElementById('totalMoneyDisplay').innerText = `$${totalMoney}`;
      closeModal('moneyModal');
    }

    function changeStep(delta) {
      playClickSound();
      const input = document.getElementById('stepInput');
      let val = parseInt(input.value, 10) || 0;
      val += delta;
      if (val === 0) {
        val = delta > 0 ? 1 : -1;
      }
      input.value = val;
    }

    function changeTargetLaps(delta) {
      playClickSound();
      const input = document.getElementById('targetLapInput');
      let val = parseInt(input.value, 10) || 1;
      val = Math.max(1, val + delta);
      targetLaps = val;
      input.value = targetLaps;
      document.getElementById('targetLapDisplay').innerText = targetLaps;
    }

    function handleManualMove() {
      playClickSound();
      if (isMoving) return;
      const input = document.getElementById('stepInput');
      let steps = parseInt(input.value, 10);

      if (isNaN(steps) || steps === 0) {
        alert("輸入步數不可為 0 ！最少為 1（或負數退後）。");
        input.value = 1;
        return;
      }

      movePlayerStepByStep(steps, true);
    }

    async function movePlayerStepByStep(steps, allowSurprise = true) {
      isMoving = true;
      const direction = steps > 0 ? 1 : -1;
      const totalSteps = Math.abs(steps);

      for (let i = 0; i < totalSteps; i++) {
        currentPosition = (currentPosition + direction + totalCells) % totalCells;
        
        if (direction > 0) {
          totalStepsTaken++;
        } else {
          totalStepsTaken = Math.max(0, totalStepsTaken - 1);
        }

        completedLaps = Math.floor(totalStepsTaken / totalCells);
        document.getElementById('completedLapDisplay').innerText = completedLaps;

        updatePlayerPositionUI();
        playStepSound();

        await new Promise(resolve => setTimeout(resolve, 200));
      }

      isMoving = false;
      document.getElementById('stepInput').value = 1;

      if (completedLaps >= targetLaps) {
        playWinSound();
        openModal('winModal');
      } else if (allowSurprise) {
        triggerSurpriseDraw();
      }
    }

    function updatePlayerPositionUI() {
      cellElements.forEach(cell => cell.classList.remove('active'));
      const currentCell = cellElements[currentPosition];
      if (currentCell) {
        currentCell.classList.add('active');
      }
    }

    function triggerSurpriseDraw() {
      let selectedSurprise = null;

      if (currentPosition >= 1 && currentPosition <= 3) {
        selectedSurprise = surprises.find(s => s.name === "再前進１步");
      } else {
        const totalWeight = surprises.reduce((sum, item) => sum + item.weight, 0);
        let randomNum = Math.random() * totalWeight;

        for (let item of surprises) {
          if (randomNum < item.weight) {
            selectedSurprise = item;
            break;
          }
          randomNum -= item.weight;
        }
      }

      if (selectedSurprise) {
        playSurpriseSound();
        document.getElementById('surpriseResultText').innerText = `🎉 恭喜獲得：${selectedSurprise.name}`;
        selectedSurprise.action();
        openModal('surpriseModal');
      }
    }

    function autoStep(steps) {
      setTimeout(() => {
        movePlayerStepByStep(steps, false); 
      }, 500);
    }

    function handleExtraTurn() {
      setTimeout(() => {
        alert("獲得『再來１次』！請再次點擊移動按鈕。");
      }, 500);
    }

    function changePrize(delta) {
      playClickSound();
      prizeCount = Math.max(1, prizeCount + delta);
      document.getElementById('prizeDisplay').innerText = prizeCount;
    }

    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      playClickSound();
      document.getElementById(id).classList.remove('active');
    }

    function resetGame() {
      playClickSound();
      currentPosition = 0;
      totalStepsTaken = 0;
      completedLaps = 0;
      prizeCount = 1;
      
      document.getElementById('prizeDisplay').innerText = prizeCount;
      document.getElementById('completedLapDisplay').innerText = completedLaps;
      document.getElementById('stepInput').value = 1;
      document.getElementById('moneyDiceBox').innerText = "1";
      document.getElementById('stepDiceBox').innerText = "1";
      updatePlayerPositionUI();
      closeModal('winModal');
    }
  </script>
</body>
</html>
