<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>可愛大富翁 v1.0.6 - 挑戰扣費版</title>
  <style>
    :root {
      --bg-color: #fef6e4;
      --board-bg: #ffffff;
      --cell-bg: #ffeaa7;
      --cell-border: #fdcb6e;
      --cell-text: #d63031;
      
      --active-bg: #ff7675;
      --active-text: #ffffff;
      --active-shadow: 0 0 15px #ff7675;

      --primary: #ff7675;
      --secondary: #74b9ff;
      --accent: #fd79a8;
      --text: #2d3436;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', 'Comic Sans MS', "Chalkboard SE", "Yu Gothic", sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 6px;
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 560px;
      height: calc(100vh - 12px);
      max-height: 860px;
      background: var(--board-bg);
      border: 4px solid #fab1a0;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 3px;
      padding: 4px;
      position: relative;
    }

    .cell {
      background-color: var(--cell-bg);
      border: 2px solid var(--cell-border);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: 800;
      color: var(--cell-text);
      text-align: center;
      position: relative;
      transition: all 0.15s ease-in-out;
    }

    .cell.start-cell {
      background-color: #ffabe7;
      border-color: #fd79a8;
      color: #000;
      font-size: 18px;
    }

    .cell.active {
      background-color: var(--active-bg) !important;
      color: var(--active-text) !important;
      border-color: var(--active-bg);
      box-shadow: var(--active-shadow);
      font-size: 28px;
      transform: scale(1.06);
      z-index: 5;
    }

    .center-dashboard {
      grid-column: 2 / 6;
      grid-row: 2 / 10;
      background: #f1f2f6;
      border-radius: 12px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
      border: 2px dashed #dfe6e9;
      z-index: 1;
    }

    .dashboard-title {
      font-size: 18px;
      color: #d63031;
      font-weight: bold;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .version-tag {
      font-size: 12px;
      color: #636e72;
      font-weight: normal;
    }

    .section-box {
      width: 100%;
      background: #ffffff;
      padding: 6px 6px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      text-align: center;
    }

    .section-box-large {
      padding: 10px 8px !important;
      border: 2px solid #74b9ff;
    }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #636e72;
      margin-bottom: 4px;
    }

    .section-title-large {
      font-size: 16px !important;
      font-weight: 900 !important;
      color: #2d3436 !important;
      margin-bottom: 8px !important;
    }

    .input-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    input[type="number"] {
      width: 52px;
      height: 36px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      border: 2px solid #74b9ff;
      border-radius: 8px;
      outline: none;
    }

    .input-large {
      width: 75px !important;
      height: 48px !important;
      font-size: 24px !important;
      border-width: 3px !important;
    }

    .btn {
      padding: 6px 10px;
      font-size: 13px;
      font-weight: bold;
      color: white;
      background-color: var(--secondary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 0 #0984e3;
    }

    .btn:active {
      box-shadow: 0 1px 0 #0984e3;
      transform: translateY(2px);
    }

    .btn-big {
      font-size: 18px !important;
      padding: 10px 18px !important;
      border-radius: 12px !important;
      font-weight: 900 !important;
      min-height: 48px;
    }

    .btn-adjust {
      width: 36px;
      height: 36px;
      font-size: 20px;
      font-weight: 900;
      border-radius: 8px;
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 0;
    }

    .btn-adjust-large {
      width: 48px !important;
      height: 48px !important;
      font-size: 26px !important;
      border-radius: 12px !important;
    }

    .btn-minus {
      background-color: #ff7675;
      box-shadow: 0 3px 0 #d63031;
    }
    .btn-minus:active {
      box-shadow: 0 1px 0 #d63031;
      transform: translateY(2px);
    }

    .btn-plus {
      background-color: #2ed573;
      box-shadow: 0 3px 0 #26af5f;
    }
    .btn-plus:active {
      box-shadow: 0 1px 0 #26af5f;
      transform: translateY(2px);
    }

    .dual-dice-group {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 8px;
    }

    .dice-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .dice-label {
      font-size: 14px;
      font-weight: bold;
      color: #2d3436;
    }

    .dice-box {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
      border: 4px solid #e17055;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 900;
      color: #d63031;
      cursor: pointer;
      box-shadow: 0 4px 0 #d63031;
    }

    .dice-box.rolling {
      animation: diceRoll 0.8s ease-in-out infinite;
    }

    @keyframes diceRoll {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-25deg) scale(1.15); }
      50% { transform: rotate(25deg) scale(0.9); }
      75% { transform: rotate(-15deg) scale(1.1); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .money-total-box {
      background: #f8efba;
      border: 2px dashed #e1b12c;
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .money-title {
      font-size: 15px;
      font-weight: bold;
      color: #222f3e;
    }

    .money-val {
      font-size: 22px;
      font-weight: 900;
      color: #10ac84;
    }

    .stat-display {
      font-size: 20px;
      font-weight: bold;
      color: #2d3436;
      min-width: 32px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-content {
      background: white;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border: 5px solid var(--accent);
      transform: scale(0.8);
      transition: transform 0.2s;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-title {
      font-size: 22px;
      color: #ff7675;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .modal-desc {
      font-size: 16px;
      color: #2d3436;
      margin-bottom: 12px;
      font-weight: bold;
      line-height: 1.4;
    }

    .modal-btn {
      font-size: 16px;
      padding: 8px 18px;
      margin: 4px;
    }

    .diff-btn-group, .option-btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
    }

    .opt-btn {
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      background: #74b9ff;
      color: white;
      box-shadow: 0 3px 0 #0984e3;
      cursor: pointer;
    }
    .opt-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0984e3;
    }

    .opt-btn.disabled {
      background: #b2bec3 !important;
      box-shadow: 0 3px 0 #636e72 !important;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .sound-btn {
      background: #fdcb6e;
      color: #2d3436;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      margin: 6px 0;
      cursor: pointer;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="game-container" id="board">
    <div class="center-dashboard">
      <div class="dashboard-title">
        🎲 歡樂大富翁 <span class="version-tag">v1.0.6 挑戰扣費版</span>
      </div>

      <div class="section-box section-box-large">
        <div class="section-title section-title-large">🎲 獨立雙骰區 (金額1-50 / 點數1-18)</div>
        <div class="dual-dice-group">
          <div class="dice-item">
            <span class="dice-label">💰 金額骰(1-5)</span>
            <div class="dice-box" id="moneyDiceBox" onclick="rollSingleDice('money')">1</div>
            <button class="btn btn-big" style="background-color: #10ac84; box-shadow: 0 4px 0 #0abde3;" onclick="rollSingleDice('money')">擲金額</button>
          </div>
          <div class="dice-item">
            <span class="dice-label">🎯 點數骰(1-18)</span>
            <div class="dice-box" id="stepDiceBox" onclick="rollSingleDice('step')">1</div>
            <button class="btn btn-big" style="background-color: #ff9f43; box-shadow: 0 4px 0 #ee5253;" onclick="rollSingleDice('step')">抽獎</button>
          </div>
        </div>

        <div class="money-total-box">
          <div class="money-title">目前總金額：</div>
          <div class="money-val" id="totalMoneyDisplay">$0</div>
          <div class="input-group">
            <button class="btn-adjust btn-minus" style="width:32px; height:32px; font-size:18px;" onclick="customAdjustMoney(-1)">-</button>
            <button class="btn-adjust btn-plus" style="width:32px; height:32px; font-size:18px;" onclick="customAdjustMoney(1)">+</button>
          </div>
        </div>
      </div>

      <div class="section-box section-box-large" style="border-color: #ff7675;">
        <div class="section-title section-title-large">🚶‍♂️ 輸入移動步數 (不可為0)</div>
        <div class="input-group">
          <button class="btn-adjust btn-adjust-large btn-minus" onclick="changeStep(-1)">-</button>
          <input type="number" id="stepInput" class="input-large" value="1">
          <button class="btn-adjust btn-adjust-large btn-plus" onclick="changeStep(1)">+</button>
          <button class="btn btn-big" style="margin-left: 6px; background-color: #ff7675; box-shadow: 0 4px 0 #d63031;" onclick="handleManualMove()">移動</button>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">🎁 目前獎品數 (最少1)</div>
        <div class="input-group">
          <button class="btn-adjust btn-minus" onclick="changePrize(-1)">-</button>
          <span class="stat-display" id="prizeDisplay">1</span>
          <button class="btn-adjust btn-plus" onclick="changePrize(1)">+</button>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">目標圈數 / 已完成圈數</div>
        <div class="input-group" style="margin-bottom: 2px;">
          <button class="btn-adjust btn-minus" onclick="changeTargetLaps(-1)">-</button>
          <input type="number" id="targetLapInput" value="1" min="1">
          <button class="btn-adjust btn-plus" onclick="changeTargetLaps(1)">+</button>
        </div>
        <div style="font-size: 12px; font-weight: bold; color: #0984e3;">
          已完成 <span id="completedLapDisplay">0</span> / <span id="targetLapDisplay">1</span> 圈
        </div>
      </div>

      <button class="btn btn-big" style="background-color: #a55eea; box-shadow: 0 4px 0 #8854d0; width: 95%; min-height:42px; font-size:16px !important;" onclick="resetGame()">🔄 再開一局 (保留金額)</button>
    </div>
  </div>

  <div class="modal-overlay" id="moneyModal">
    <div class="modal-content" style="border-color: #fdcb6e;">
      <div class="modal-title" id="moneyModalTitle" style="color: #e17055;">💰 調整金額</div>
      <div style="font-size: 14px; color: #636e72; margin-bottom: 10px;">請點擊按鈕或手動輸入金額：</div>
      <div class="input-group" style="margin-bottom: 12px;">
        <button class="btn-adjust btn-minus" style="width:42px; height:42px; font-size:22px;" onclick="changeModalMoneyInput(-100)">-</button>
        <input type="number" id="moneyModalInput" value="500" style="width: 100px; height: 42px; font-size: 20px;">
        <button class="btn-adjust btn-plus" style="width:42px; height:42px; font-size:22px;" onclick="changeModalMoneyInput(100)">+</button>
      </div>
      <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 16px;">
        <button class="btn" style="background-color: #ff7675; box-shadow: 0 3px 0 #d63031; padding: 6px 12px;" onclick="changeModalMoneyInput(-500)">-500</button>
        <button class="btn" style="background-color: #2ed573; box-shadow: 0 3px 0 #26af5f; padding: 6px 12px;" onclick="changeModalMoneyInput(500)">+500</button>
      </div>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button class="btn modal-btn" style="background-color: #2ed573; box-shadow: 0 4px 0 #26af5f;" onclick="confirmCustomMoney()">確定</button>
        <button class="btn modal-btn" style="background-color: #ff7675; box-shadow: 0 4px 0 #d63031;" onclick="closeModal('moneyModal')">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="diceModal">
    <div class="modal-content" style="border-color: #74b9ff;">
      <div class="modal-title" id="diceModalTitle" style="color: #0984e3;">🎲 骰子結果</div>
      <div class="modal-desc" id="diceModalPoint">骰出點數：0 點</div>
      <div class="modal-desc" style="color: #00b894; font-size: 20px;" id="diceModalMoney">獎品號碼：0 號</div>
      <button class="btn modal-btn" onclick="closeModal('diceModal')">確定</button>
    </div>
  </div>

  <div class="modal-overlay" id="winModal">
    <div class="modal-content" style="border-color: #ff7675;">
      <div class="modal-title">🏆 恭喜獲勝！</div>
      <div class="modal-desc">你已經跑滿設定的圈數囉！</div>
      <button class="btn modal-btn" style="background-color: #00b894; box-shadow: 0 4px 0 #008f68;" onclick="resetGame()">再玩一次 (保留金額)</button>
    </div>
  </div>

  <div class="modal-overlay" id="askChallengeModal">
    <div class="modal-content" style="border-color: #ff7675;">
      <div class="modal-title">⚔️ 觸發挑戰任務！</div>
      <div class="modal-desc" id="askChallengeName">發現挑戰題！要接受挑戰嗎？</div>
      <div style="display:flex; justify-content:center; gap: 10px;">
        <button class="btn modal-btn" style="background-color: #2ed573; box-shadow: 0 4px 0 #26af5f;" onclick="acceptChallenge()">選擇難度</button>
        <button class="btn modal-btn" style="background-color: #b2bec3; box-shadow: 0 4px 0 #636e72;" onclick="closeModal('askChallengeModal')">不挑戰</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="selectDiffModal">
    <div class="modal-content" style="border-color: #74b9ff;">
      <div class="modal-title" id="selectDiffTitle">選擇難度</div>
      <div class="modal-desc" style="font-size:14px; color:#e17055;" id="userMoneyHint">目前持有金額：$0</div>
      <div class="diff-btn-group" id="diffBtnContainer"></div>
      <button class="btn modal-btn" style="background-color: #b2bec3; box-shadow: 0 4px 0 #636e72;" onclick="closeModal('selectDiffModal')">不挑戰 (返回)</button>
    </div>
  </div>

  <div class="modal-overlay" id="playGameModal">
    <div class="modal-content" style="border-color: #a55eea;">
      <div class="modal-title" id="gameModalTitle">挑戰進行中</div>
      <div class="modal-desc" id="gameModalQuestion">題目載入中...</div>
      <div id="gameSoundContainer"></div>
      <div class="option-btn-group" id="gameOptionsContainer"></div>
    </div>
  </div>

  <div class="modal-overlay" id="resultModal">
    <div class="modal-content" id="resultContent">
      <div class="modal-title" id="resultModalTitle">挑戰結果</div>
      <div class="modal-desc" id="resultModalText">...</div>
      <div class="modal-desc" style="color: #d63031;" id="resultModalAnswer"></div>
      <button class="btn modal-btn" style="background-color: #00b894; box-shadow: 0 4px 0 #008f68;" onclick="closeModal('resultModal')">確定</button>
    </div>
  </div>

  <script>
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playClickSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    function playStepSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(350, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }

    function playWinSound() {
      initAudio();
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const startTime = audioCtx.currentTime + idx * 0.12;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(startTime); osc.stop(startTime + 0.3);
      });
    }

    function speakText(text, lang = 'zh-TW') {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
      }
    }

    const challengeCategories = [
      {
        name: "旋轉挑戰",
        levels: [
          { diffName: "60秒 (簡單)", reward: 200, need: 100, type: "action", target: "60秒" },
          { diffName: "80秒 (中等)", reward: 500, need: 20
