<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>可愛大富翁 v1.0.6 - 挑戰扣費版</title>
  <style>
    :root {
      --bg-color: #fef6e4;
      --board-bg: #ffffff;
      --cell-bg: #ffeaa7;
      --cell-border: #fdcb6e;
      --cell-text: #d63031;
      
      --active-bg: #ff7675;
      --active-text: #ffffff;
      --active-shadow: 0 0 15px #ff7675;

      --primary: #ff7675;
      --secondary: #74b9ff;
      --accent: #fd79a8;
      --text: #2d3436;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', 'Comic Sans MS', "Chalkboard SE", "Yu Gothic", sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 6px;
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 560px;
      height: calc(100vh - 12px);
      max-height: 860px;
      background: var(--board-bg);
      border: 4px solid #fab1a0;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 3px;
      padding: 4px;
      position: relative;
    }

    .cell {
      background-color: var(--cell-bg);
      border: 2px solid var(--cell-border);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: 800;
      color: var(--cell-text);
      text-align: center;
      position: relative;
      transition: all 0.15s ease-in-out;
    }

    .cell.start-cell {
      background-color: #ffabe7;
      border-color: #fd79a8;
      color: #000;
      font-size: 18px;
    }

    .cell.active {
      background-color: var(--active-bg) !important;
      color: var(--active-text) !important;
      border-color: var(--active-bg);
      box-shadow: var(--active-shadow);
      font-size: 28px;
      transform: scale(1.06);
      z-index: 5;
    }

    .center-dashboard {
      grid-column: 2 / 6;
      grid-row: 2 / 10;
      background: #f1f2f6;
      border-radius: 12px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
      border: 2px dashed #dfe6e9;
      z-index: 1;
    }

    .dashboard-title {
      font-size: 18px;
      color: #d63031;
      font-weight: bold;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .version-tag {
      font-size: 12px;
      color: #636e72;
      font-weight: normal;
    }

    .section-box {
      width: 100%;
      background: #ffffff;
      padding: 6px 6px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      text-align: center;
    }

    .section-box-large {
      padding: 10px 8px !important;
      border: 2px solid #74b9ff;
    }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #636e72;
      margin-bottom: 4px;
    }

    .section-title-large {
      font-size: 16px !important;
      font-weight: 900 !important;
      color: #2d3436 !important;
      margin-bottom: 8px !important;
    }

    .input-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    input[type="number"] {
      width: 52px;
      height: 36px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      border: 2px solid #74b9ff;
      border-radius: 8px;
      outline: none;
    }

    .input-large {
      width: 75px !important;
      height: 48px !important;
      font-size: 24px !important;
      border-width: 3px !important;
    }

    .btn {
      padding: 6px 10px;
      font-size: 13px;
      font-weight: bold;
      color: white;
      background-color: var(--secondary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 0 #0984e3;
    }

    .btn:active {
      box-shadow: 0 1px 0 #0984e3;
      transform: translateY(2px);
    }

    .btn-big {
      font-size: 18px !important;
      padding: 10px 18px !important;
      border-radius: 12px !important;
      font-weight: 900 !important;
      min-height: 48px;
    }

    .btn-adjust {
      width: 36px;
      height: 36px;
      font-size: 20px;
      font-weight: 900;
      border-radius: 8px;
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 0;
    }

    .btn-adjust-large {
      width: 48px !important;
      height: 48px !important;
      font-size: 26px !important;
      border-radius: 12px !important;
    }

    .btn-minus {
      background-color: #ff7675;
      box-shadow: 0 3px 0 #d63031;
    }
    .btn-minus:active {
      box-shadow: 0 1px 0 #d63031;
      transform: translateY(2px);
    }

    .btn-plus {
      background-color: #2ed573;
      box-shadow: 0 3px 0 #26af5f;
    }
    .btn-plus:active {
      box-shadow: 0 1px 0 #26af5f;
      transform: translateY(2px);
    }

    .dual-dice-group {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 8px;
    }

    .dice-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .dice-label {
      font-size: 14px;
      font-weight: bold;
      color: #2d3436;
    }

    .dice-box {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
      border: 4px solid #e17055;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 900;
      color: #d63031;
      cursor: pointer;
      box-shadow: 0 4px 0 #d63031;
    }

    .dice-box.rolling {
      animation: diceRoll 0.8s ease-in-out infinite;
    }

    @keyframes diceRoll {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-25deg) scale(1.15); }
      50% { transform: rotate(25deg) scale(0.9); }
      75% { transform: rotate(-15deg) scale(1.1); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .money-total-box {
      background: #f8efba;
      border: 2px dashed #e1b12c;
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .money-title {
      font-size: 15px;
      font-weight: bold;
      color: #222f3e;
    }

    .money-val {
      font-size: 22px;
      font-weight: 900;
      color: #10ac84;
    }

    .stat-display {
      font-size: 20px;
      font-weight: bold;
      color: #2d3436;
      min-width: 32px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-content {
      background: white;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border: 5px solid var(--accent);
      transform: scale(0.8);
      transition: transform 0.2s;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-title {
      font-size: 22px;
      color: #ff7675;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .modal-desc {
      font-size: 16px;
      color: #2d3436;
      margin-bottom: 12px;
      font-weight: bold;
      line-height: 1.4;
    }

    .modal-btn {
      font-size: 16px;
      padding: 8px 18px;
      margin: 4px;
    }

    .diff-btn-group, .option-btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
    }

    .opt-btn {
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      background: #74b9ff;
      color: white;
      box-shadow: 0 3px 0 #0984e3;
      cursor: pointer;
    }
    .opt-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0984e3;
    }

    .opt-btn.disabled {
      background: #b2bec3 !important;
      box-shadow: 0 3px 0 #636e72 !important;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .sound-btn {
      background: #fdcb6e;
      color: #2d3436;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      margin: 6px 0;
      cursor: pointer;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="game-container" id="board">
    <div class="center-dashboard">
      <div class="dashboard-title">
        🎲 歡樂大富翁 <span class="version-tag">v1.0.6 挑戰扣費版</span>
      </div>

      <div class="section-box section-box-large">
        <div class="section-title section-title-large">🎲 獨立雙骰區 (金額1-50 / 點數1-18)</div>
        <div class="dual-dice-group">
          <div class="dice-item">
            <span class="dice-label">💰 金額骰(1-5)</span>
            <div class="dice-box" id="moneyDiceBox" onclick="rollSingleDice('money')">1</div>
            <button class="btn btn-big" style="background-color: #10ac84; box-shadow: 0 4px 0 #0abde3;" onclick="rollSingleDice('money')">擲金額</button>
          </div>
          <div class="dice-item">
            <span class="dice-label">🎯 點數骰(1-18)</span>
            <div class="dice-box" id="stepDiceBox" onclick="rollSingleDice('step')">1</div>
            <button class="btn btn-big" style="background-color: #ff9f43; box-shadow: 0 4px 0 #ee5253;" onclick="rollSingleDice('step')">抽獎</button>
          </div>
        </div>

        <div class="money-total-box">
          <div class="money-title">目前總金額：</div>
          <div class="money-val" id="totalMoneyDisplay">$0</div>
          <div class="input-group">
            <button class="btn-adjust btn-minus" style="width:32px; height:32px; font-size:18px;" onclick="customAdjustMoney(-1)">-</button>
            <button class="btn-adjust btn-plus" style="width:32px; height:32px; font-size:18px;" onclick="customAdjustMoney(1)">+</button>
          </div>
        </div>
      </div>

      <div class="section-box section-box-large" style="border-color: #ff7675;">
        <div class="section-title section-title-large">🚶‍♂️ 輸入移動步數 (不可為0)</div>
        <div class="input-group">
          <button class="btn-adjust btn-adjust-large btn-minus" onclick="changeStep(-1)">-</button>
          <input type="number" id="stepInput" class="input-large" value="1">
          <button class="btn-adjust btn-adjust-large btn-plus" onclick="changeStep(1)">+</button>
          <button class="btn btn-big" style="margin-left: 6px; background-color: #ff7675; box-shadow: 0 4px 0 #d63031;" onclick="handleManualMove()">移動</button>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">🎁 目前獎品數 (最少1)</div>
        <div class="input-group">
          <button class="btn-adjust btn-minus" onclick="changePrize(-1)">-</button>
          <span class="stat-display" id="prizeDisplay">1</span>
          <button class="btn-adjust btn-plus" onclick="changePrize(1)">+</button>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">目標圈數 / 已完成圈數</div>
        <div class="input-group" style="margin-bottom: 2px;">
          <button class="btn-adjust btn-minus" onclick="changeTargetLaps(-1)">-</button>
          <input type="number" id="targetLapInput" value="1" min="1">
          <button class="btn-adjust btn-plus" onclick="changeTargetLaps(1)">+</button>
        </div>
        <div style="font-size: 12px; font-weight: bold; color: #0984e3;">
          已完成 <span id="completedLapDisplay">0</span> / <span id="targetLapDisplay">1</span> 圈
        </div>
      </div>

      <button class="btn btn-big" style="background-color: #a55eea; box-shadow: 0 4px 0 #8854d0; width: 95%; min-height:42px; font-size:16px !important;" onclick="resetGame()">🔄 再開一局 (保留金額)</button>
    </div>
  </div>

  <div class="modal-overlay" id="moneyModal">
    <div class="modal-content" style="border-color: #fdcb6e;">
      <div class="modal-title" id="moneyModalTitle" style="color: #e17055;">💰 調整金額</div>
      <div style="font-size: 14px; color: #636e72; margin-bottom: 10px;">請點擊按鈕或手動輸入金額：</div>
      <div class="input-group" style="margin-bottom: 12px;">
        <button class="btn-adjust btn-minus" style="width:42px; height:42px; font-size:22px;" onclick="changeModalMoneyInput(-100)">-</button>
        <input type="number" id="moneyModalInput" value="500" style="width: 100px; height: 42px; font-size: 20px;">
        <button class="btn-adjust btn-plus" style="width:42px; height:42px; font-size:22px;" onclick="changeModalMoneyInput(100)">+</button>
      </div>
      <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 16px;">
        <button class="btn" style="background-color: #ff7675; box-shadow: 0 3px 0 #d63031; padding: 6px 12px;" onclick="changeModalMoneyInput(-500)">-500</button>
        <button class="btn" style="background-color: #2ed573; box-shadow: 0 3px 0 #26af5f; padding: 6px 12px;" onclick="changeModalMoneyInput(500)">+500</button>
      </div>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button class="btn modal-btn" style="background-color: #2ed573; box-shadow: 0 4px 0 #26af5f;" onclick="confirmCustomMoney()">確定</button>
        <button class="btn modal-btn" style="background-color: #ff7675; box-shadow: 0 4px 0 #d63031;" onclick="closeModal('moneyModal')">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="diceModal">
    <div class="modal-content" style="border-color: #74b9ff;">
      <div class="modal-title" id="diceModalTitle" style="color: #0984e3;">🎲 骰子結果</div>
      <div class="modal-desc" id="diceModalPoint">骰出點數：0 點</div>
      <div class="modal-desc" style="color: #00b894; font-size: 20px;" id="diceModalMoney">獎品號碼：0 號</div>
      <button class="btn modal-btn" onclick="closeModal('diceModal')">確定</button>
    </div>
  </div>

  <div class="modal-overlay" id="winModal">
    <div class="modal-content" style="border-color: #ff7675;">
      <div class="modal-title">🏆 恭喜獲勝！</div>
      <div class="modal-desc">你已經跑滿設定的圈數囉！</div>
      <button class="btn modal-btn" style="background-color: #00b894; box-shadow: 0 4px 0 #008f68;" onclick="resetGame()">再玩一次 (保留金額)</button>
    </div>
  </div>

  <div class="modal-overlay" id="askChallengeModal">
    <div class="modal-content" style="border-color: #ff7675;">
      <div class="modal-title">⚔️ 觸發挑戰任務！</div>
      <div class="modal-desc" id="askChallengeName">發現挑戰題！要接受挑戰嗎？</div>
      <div style="display:flex; justify-content:center; gap: 10px;">
        <button class="btn modal-btn" style="background-color: #2ed573; box-shadow: 0 4px 0 #26af5f;" onclick="acceptChallenge()">選擇難度</button>
        <button class="btn modal-btn" style="background-color: #b2bec3; box-shadow: 0 4px 0 #636e72;" onclick="closeModal('askChallengeModal')">不挑戰</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="selectDiffModal">
    <div class="modal-content" style="border-color: #74b9ff;">
      <div class="modal-title" id="selectDiffTitle">選擇難度</div>
      <div class="modal-desc" style="font-size:14px; color:#e17055;" id="userMoneyHint">目前持有金額：$0</div>
      <div class="diff-btn-group" id="diffBtnContainer"></div>
      <button class="btn modal-btn" style="background-color: #b2bec3; box-shadow: 0 4px 0 #636e72;" onclick="closeModal('selectDiffModal')">不挑戰 (返回)</button>
    </div>
  </div>

  <div class="modal-overlay" id="playGameModal">
    <div class="modal-content" style="border-color: #a55eea;">
      <div class="modal-title" id="gameModalTitle">挑戰進行中</div>
      <div class="modal-desc" id="gameModalQuestion">題目載入中...</div>
      <div id="gameSoundContainer"></div>
      <div class="option-btn-group" id="gameOptionsContainer"></div>
    </div>
  </div>

  <div class="modal-overlay" id="resultModal">
    <div class="modal-content" id="resultContent">
      <div class="modal-title" id="resultModalTitle">挑戰結果</div>
      <div class="modal-desc" id="resultModalText">...</div>
      <div class="modal-desc" style="color: #d63031;" id="resultModalAnswer"></div>
      <button class="btn modal-btn" style="background-color: #00b894; box-shadow: 0 4px 0 #008f68;" onclick="closeModal('resultModal')">確定</button>
    </div>
  </div>

  <script>
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playClickSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    function playStepSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(350, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }

    function playWinSound() {
      initAudio();
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const startTime = audioCtx.currentTime + idx * 0.12;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(startTime); osc.stop(startTime + 0.3);
      });
    }

    function speakText(text, lang = 'zh-TW') {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
      }
    }

    const challengeCategories = [
      {
        name: "旋轉挑戰",
        levels: [
          { diffName: "60秒 (簡單)", reward: 200, need: 100, type: "action", target: "60秒" },
          { diffName: "80秒 (中等)", reward: 500, need: 200, type: "action", target: "80秒" },
          { diffName: "90秒 (困難)", reward: 1000, need: 300, type: "action", target: "90秒" }
        ]
      },
      {
        name: "擊飛挑戰",
        levels: [
          { diffName: "1顆 (簡單)", reward: 200, need: 100, type: "action", target: "1顆" },
          { diffName: "3顆 (中等)", reward: 500, need: 200, type: "action", target: "3顆" },
          { diffName: "5顆 (困難)", reward: 1000, need: 300, type: "action", target: "5顆" }
        ]
      },
      {
        name: "抽獎機台",
        levels: [
          { diffName: "黑色", reward: 0, need: 200, type: "slot", color: "黑色" },
          { diffName: "白色", reward: 300, need: 200, type: "slot", color: "白色" },
          { diffName: "紅色", reward: 600, need: 200, type: "slot", color: "紅色" }
        ]
      },
      {
        name: "數學遊戲",
        levels: [
          { diffName: "簡單 (兩數相加)", reward: 200, need: 100, type: "math_add_2" },
          { diffName: "中等 (兩數相減)", reward: 500, need: 200, type: "math_sub_2" },
          { diffName: "困難 (三數加減)", reward: 1000, need: 300, type: "math_mix_3" }
        ]
      },
      {
        name: "英文字母發音挑戰",
        levels: [
          { diffName: "簡單 (1個字母)", reward: 200, need: 100, type: "phonics_en", count: 1 },
          { diffName: "中等 (2個字母)", reward: 500, need: 200, type: "phonics_en", count: 2 },
          { diffName: "困難 (3個字母)", reward: 1000, need: 300, type: "phonics_en", count: 3 }
        ]
      },
      {
        name: "中文注音發音挑戰",
        levels: [
          { diffName: "簡單 (1個注音)", reward: 200, need: 100, type: "phonics_zh", count: 1 },
          { diffName: "中等 (2個注音)", reward: 500, need: 200, type: "phonics_zh", count: 2 },
          { diffName: "困難 (3個注音)", reward: 1000, need: 300, type: "phonics_zh", count: 3 }
        ]
      },
      {
        name: "英文單字猜猜看",
        levels: [
          { diffName: "簡單 (動物-水果)", reward: 200, need: 100, type: "word_en", category: "easy" },
          { diffName: "中等 (生活用品)", reward: 500, need: 200, type: "word_en", category: "medium" },
          { diffName: "困難 (生活常用字)", reward: 1000, need: 300, type: "word_en", category: "hard" }
        ]
      },
      {
        name: "中文單字猜猜看",
        levels: [
          { diffName: "簡單 (動物-水果)", reward: 200, need: 100, type: "word_zh", category: "easy" },
          { diffName: "中等 (生活用品)", reward: 500, need: 200, type: "word_zh", category: "medium" },
          { diffName: "困難 (生活常用字)", reward: 1000, need: 300, type: "word_zh", category: "hard" }
        ]
      }
    ];

    const COLS = 6, ROWS = 10;
    const pathCoords = [];
    for (let c = 1; c <= COLS; c++) pathCoords.push({ r: 1, c: c });
    for (let r = 2; r <= ROWS; r++) pathCoords.push({ r: r, c: COLS });
    for (let c = COLS - 1; c >= 1; c--) pathCoords.push({ r: ROWS, c: c });
    for (let r = ROWS - 1; r >= 2; r--) pathCoords.push({ r: r, c: 1 });

    const totalCells = pathCoords.length;
    let currentPosition = 0;
    let totalStepsTaken = 0;
    let prizeCount = 1;
    let completedLaps = 0;
    let targetLaps = 1;
    let totalMoney = 0;
    let isMoving = false;
    let isRolling = false;
    let currentMoneyDir = 1;

    let selectedCategory = null;
    let currentChallengeLevel = null;

    const cellElements = [];
    const board = document.getElementById('board');

    pathCoords.forEach((coord, idx) => {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.id = `cell-${idx}`;
      cell.style.gridRow = coord.r;
      cell.style.gridColumn = coord.c;

      if (idx === 0) {
        cell.classList.add('start-cell');
        cell.innerHTML = '起點<br>0';
      } else {
        cell.innerText = idx;
      }
      board.appendChild(cell);
      cellElements.push(cell);
    });

    updatePlayerPositionUI();

    function rollSingleDice(type) {
      if (isRolling || isMoving) return;
      isRolling = true;
      playClickSound();

      const maxVal = (type === 'money') ? 5 : 18;
      const targetBox = document.getElementById(type === 'money' ? 'moneyDiceBox' : 'stepDiceBox');
      targetBox.classList.add('rolling');

      const rollInterval = setInterval(() => {
        targetBox.innerText = Math.floor(Math.random() * maxVal) + 1;
        playStepSound();
      }, 60);

      setTimeout(() => {
        clearInterval(rollInterval);
        const finalValue = Math.floor(Math.random() * maxVal) + 1;
        targetBox.innerText = finalValue;
        targetBox.classList.remove('rolling');
        isRolling = false;

        if (type === 'money') {
          const earned = finalValue * 100;
          totalMoney += earned;
          document.getElementById('totalMoneyDisplay').innerText = `$${totalMoney}`;
          document.getElementById('diceModalTitle').innerText = '💰 金額骰結果';
          document.getElementById('diceModalPoint').innerText = `骰出點數：${finalValue} 點`;
          document.getElementById('diceModalMoney').innerText = `獲得金額：${earned} 元`;
        } else {
          document.getElementById('diceModalTitle').innerText = '🎁 抽獎結果';
          document.getElementById('diceModalPoint').innerText = `骰出點數：${finalValue} 點`;
          document.getElementById('diceModalMoney').innerText = `獎品號碼：${finalValue} 號`;
        }
        openModal('diceModal');
      }, 800);
    }

    function customAdjustMoney(direction) {
      playClickSound();
      currentMoneyDir = direction;
      document.getElementById('moneyModalTitle').innerText = direction > 0 ? "💰 增加金額 (+)" : "💰 扣除金額 (-)";
      document.getElementById('moneyModalInput').value = 500;
      openModal('moneyModal');
    }

    function changeModalMoneyInput(delta) {
      playClickSound();
      const input = document.getElementById('moneyModalInput');
      let val = parseInt(input.value, 10) || 0;
      input.value = Math.max(0, val + delta);
    }

    function confirmCustomMoney() {
      playClickSound();
      const input = document.getElementById('moneyModalInput');
      let amount = parseInt(input.value, 10) || 0;
      totalMoney += amount * currentMoneyDir;
      document.getElementById('totalMoneyDisplay').innerText = `$${totalMoney}`;
      closeModal('moneyModal');
    }

    function changeStep(delta) {
      playClickSound();
      const input = document.getElementById('stepInput');
      let val = (parseInt(input.value, 10) || 0) + delta;
      if (val === 0) val = delta > 0 ? 1 : -1;
      input.value = val;
    }

    function changePrize(delta) {
      playClickSound();
      prizeCount = Math.max(1, prizeCount + delta);
      document.getElementById('prizeDisplay').innerText = prizeCount;
    }

    function changeTargetLaps(delta) {
      playClickSound();
      const input = document.getElementById('targetLapInput');
      targetLaps = Math.max(1, (parseInt(input.value, 10) || 1) + delta);
      input.value = targetLaps;
      document.getElementById('targetLapDisplay').innerText = targetLaps;
    }

    function handleManualMove() {
      playClickSound();
      if (isMoving) return;
      const input = document.getElementById('stepInput');
      let steps = parseInt(input.value, 10);
      if (isNaN(steps) || steps === 0) {
        alert("輸入步數不可為 0 ！");
        input.value = 1;
        return;
      }
      movePlayerStepByStep(steps);
    }

    async function movePlayerStepByStep(steps) {
      isMoving = true;
      const direction = steps > 0 ? 1 : -1;
      const totalSteps = Math.abs(steps);

      for (let i = 0; i < totalSteps; i++) {
        currentPosition = (currentPosition + direction + totalCells) % totalCells;
        totalStepsTaken += (direction > 0 ? 1 : -1);
        totalStepsTaken = Math.max(0, totalStepsTaken);

        completedLaps = Math.floor(totalStepsTaken / totalCells);
        document.getElementById('completedLapDisplay').innerText = completedLaps;

        updatePlayerPositionUI();
        playStepSound();
        await new Promise(resolve => setTimeout(resolve, 200));
      }

      isMoving = false;
      document.getElementById('stepInput').value = 1;

      if (completedLaps >= targetLaps) {
        playWinSound();
        openModal('winModal');
      } else if (currentPosition !== 0) {
        triggerChallengePrompt();
      }
    }

    function updatePlayerPositionUI() {
      cellElements.forEach(cell => cell.classList.remove('active'));
      if (cellElements[currentPosition]) cellElements[currentPosition].classList.add('active');
    }

    function triggerChallengePrompt() {
      const randIdx = Math.floor(Math.random() * challengeCategories.length);
      selectedCategory = challengeCategories[randIdx];
      
      document.getElementById('askChallengeName').innerText = `踩到了挑戰格！【${selectedCategory.name}】\n請選擇是否挑戰！`;
      openModal('askChallengeModal');
    }

    function acceptChallenge() {
      closeModal('askChallengeModal');
      document.getElementById('selectDiffTitle').innerText = `${selectedCategory.name} - 選擇難度`;
      document.getElementById('userMoneyHint').innerText = `目前持有金額：$${totalMoney}`;
      const container = document.getElementById('diffBtnContainer');
      container.innerHTML = '';

      selectedCategory.levels.forEach(lvl => {
        const btn = document.createElement('button');
        const canAfford = totalMoney >= lvl.need;
        
        btn.className = `opt-btn ${canAfford ? '' : 'disabled'}`;
        btn.innerText = `${lvl.diffName} (扣$${lvl.need} / 獎金:$${lvl.reward})`;
        
        if (canAfford) {
          btn.onclick = () => startChallengeGame(lvl);
        } else {
          btn.onclick = () => {
            alert(`金額不足！需要 $${lvl.need}，但你只有 $${totalMoney}。只能選擇其他難度或不挑戰。`);
          };
        }
        container.appendChild(btn);
      });

      openModal('selectDiffModal');
    }

    function startChallengeGame(level) {
      currentChallengeLevel = level;
      closeModal('selectDiffModal');

      // 扣除挑戰所需金額
      totalMoney -= level.need;
      document.getElementById('totalMoneyDisplay').innerText = `$${totalMoney}`;

      const title = document.getElementById('gameModalTitle');
      const qText = document.getElementById('gameModalQuestion');
      const soundContainer = document.getElementById('gameSoundContainer');
      const optsContainer = document.getElementById('gameOptionsContainer');

      title.innerText = `${selectedCategory.name} (${level.diffName})`;
      soundContainer.innerHTML = '';
      optsContainer.innerHTML = '';

      let correctAnswer = "";
      let options = [];

      if (level.type === 'action') {
        qText.innerText = `已扣除代幣 $${level.need}！\n任務目標：完成 ${selectedCategory.name} ${level.target}！`;
        options = ["完成挑戰", "挑戰失敗"];
        correctAnswer = "完成挑戰";
      } 
      else if (level.type === 'slot') {
        qText.innerText = `已扣除代幣 $${level.need}！\n機台轉動中... 開出【${level.color}】！`;
        options = ["確認領取"];
        correctAnswer = "確認領取";
      }
      else if (level.type.startsWith('math')) {
        let n1, n2, n3, ans;
        if (level.type === 'math_add_2') {
          n1 = Math.floor(Math.random() * 8) + 5;
          n2 = Math.floor(Math.random() * 8) + 5;
          ans = n1 + n2;
          qText.innerText = `[已扣 $${level.need}]\n題目：${n1} + ${n2} = ?`;
        } else if (level.type === 'math_sub_2') {
          n1 = Math.floor(Math.random() * 10) + 10;
          n2 = Math.floor(Math.random() * 8) + 1;
          ans = n1 - n2;
          qText.innerText = `[已扣 $${level.need}]\n題目：${n1} - ${n2} = ?`;
        } else {
          n1 = Math.floor(Math.random() * 10) + 5;
          n2 = Math.floor(Math.random() * 10) + 2;
          n3 = Math.floor(Math.random() * 5) + 1;
          ans = n1 + n2 - n3;
          qText.innerText = `[已扣 $${level.need}]\n題目：${n1} + ${n2} - ${n3} = ?`;
        }
        correctAnswer = ans.toString();
        options = generate3Options(ans);
      }
      else if (level.type === 'phonics_en') {
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        let targetStr = "";
        for (let i = 0; i < level.count; i++) {
          targetStr += letters.charAt(Math.floor(Math.random() * letters.length));
        }
        qText.innerText = `[已扣 $${level.need}]\n請聽發音選擇正確字母：`;
        correctAnswer = targetStr;
        options = generate3StrOptions(targetStr, () => {
          let s = "";
          for(let i=0;i<level.count;i++) s += letters.charAt(Math.floor(Math.random() * letters.length));
          return s;
        });

        const sBtn = document.createElement('button');
        sBtn.className = 'sound-btn';
        sBtn.innerText = '🔊 點擊播放發音';
        sBtn.onclick = () => speakText(targetStr, 'en-US');
        soundContainer.appendChild(sBtn);
        speakText(targetStr, 'en-US');
      }
      else if (level.type === 'phonics_zh') {
        const zhList = ["ㄅ","ㄆ","ㄇ","ㄈ","ㄉ","ㄊ","ㄋ","ㄌ","ㄍ","ㄎ","ㄏ","ㄐ","ㄑ","ㄒ","ㄓ","ㄔ","ㄕ","ㄖ","ㄗ","ㄘ","ㄙ","ㄚ","ㄛ","ㄜ","ㄝ","ㄞ","ㄟ","ㄠ","ㄡ","ㄢ","ㄣ","ㄤ","ㄥ","ㄦ","ㄧ","ㄨ","ㄩ"];
        let targetStr = "";
        for (let i = 0; i < level.count; i++) {
          targetStr += zhList[Math.floor(Math.random() * zhList.length)];
        }
        qText.innerText = `[已扣 $${level.need}]\n請聽發音選擇正確注音：`;
        correctAnswer = targetStr;
        options = generate3StrOptions(targetStr, () => {
          let s = "";
          for(let i=0;i<level.count;i++) s += zhList[Math.floor(Math.random() * zhList.length)];
          return s;
        });

        const sBtn = document.createElement('button');
        sBtn.className = 'sound-btn';
        sBtn.innerText = '🔊 點擊播放發音';
        sBtn.onclick = () => speakText(targetStr, 'zh-TW');
        soundContainer.appendChild(sBtn);
        speakText(targetStr, 'zh-TW');
      }
      else if (level.type === 'word_en' || level.type === 'word_zh') {
        const bank = {
          easy: [{zh:"蘋果", en:"Apple"}, {zh:"香蕉", en:"Banana"}, {zh:"貓咪", en:"Cat"}, {zh:"小狗", en:"Dog"}],
          medium: [{zh:"杯子", en:"Cup"}, {zh:"桌子", en:"Table"}, {zh:"椅子", en:"Chair"}, {zh:"鉛筆", en:"Pencil"}],
          hard: [{zh:"學校", en:"School"}, {zh:"朋友", en:"Friend"}, {zh:"時間", en:"Time"}, {zh:"音樂", en:"Music"}]
        };
        const pool = bank[level.category];
        const item = pool[Math.floor(Math.random() * pool.length)];

        if (level.type === 'word_en') {
          qText.innerText = `[已扣 $${level.need}]\n請聽發音選擇正確英文單字：`;
          correctAnswer = item.en;
          options = generate3StrOptions(item.en, () => pool[Math.floor(Math.random() * pool.length)].en);
          const sBtn = document.createElement('button');
          sBtn.className = 'sound-btn';
          sBtn.innerText = '🔊 點擊播放發音';
          sBtn.onclick = () => speakText(item.en, 'en-US');
          soundContainer.appendChild(sBtn);
          speakText(item.en, 'en-US');
        } else {
          qText.innerText = `[已扣 $${level.need}]\n請聽發音選擇正確中文單字：`;
          correctAnswer = item.zh;
          options = generate3StrOptions(item.zh, () => pool[Math.floor(Math.random() * pool.length)].zh);
          const sBtn = document.createElement('button');
          sBtn.className = 'sound-btn';
          sBtn.innerText = '🔊 點擊播放發音';
          sBtn.onclick = () => speakText(item.zh, 'zh-TW');
          soundContainer.appendChild(sBtn);
          speakText(item.zh, 'zh-TW');
        }
      }

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => finishChallenge(opt === correctAnswer, correctAnswer, level.reward);
        optsContainer.appendChild(btn);
      });

      openModal('playGameModal');
    }

    function generate3Options(correctVal) {
      const set = new Set([correctVal.toString()]);
      while(set.size < 3) {
        let delta = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
        set.add((correctVal + delta).toString());
      }
      return Array.from(set).sort(() => Math.random() - 0.5);
    }

    function generate3StrOptions(correctStr, genFunc) {
      const set = new Set([correctStr]);
      while(set.size < 3) {
        set.add(genFunc());
      }
      return Array.from(set).sort(() => Math.random() - 0.5);
    }

    function finishChallenge(isSuccess, correctAnswer, reward) {
      closeModal('playGameModal');
      
      const title = document.getElementById('resultModalTitle');
      const text = document.getElementById('resultModalText');
      const ansText = document.getElementById('resultModalAnswer');

      if (isSuccess) {
        playWinSound();
        title.innerText = "🎉 挑戰成功！";
        title.style.color = "#00b894";
        if (reward > 0) {
          totalMoney += reward;
          document.getElementById('totalMoneyDisplay').innerText = `$${totalMoney}`;
          text.innerText = `恭喜贏得獎金 $${reward} 元！`;
        } else {
          text.innerText = `很可惜，抽獎結果為「沒有中獎」！`;
        }
        ansText.innerText = `正確答案為：${correctAnswer}`;
      } else {
        playClickSound();
        title.innerText = "❌ 挑戰失敗！";
        title.style.color = "#d63031";
        text.innerText = `挑戰失敗，無法拿回扣除的費用。`;
        ansText.innerText = `正確答案為：${correctAnswer}`;
      }

      openModal('resultModal');
    }

    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      playClickSound();
      document.getElementById(id).classList.remove('active');
    }

    function resetGame() {
      playClickSound();
      currentPosition = 0;
      totalStepsTaken = 0;
      completedLaps = 0;
      prizeCount = 1;
      
      document.getElementById('prizeDisplay').innerText = prizeCount;
      document.getElementById('completedLapDisplay').innerText = completedLaps;
      document.getElementById('stepInput').value = 1;
      document.getElementById('moneyDiceBox').innerText = "1";
      document.getElementById('stepDiceBox').innerText = "1";
      updatePlayerPositionUI();
      closeModal('winModal');
    }
  </script>
</body>
</html>
